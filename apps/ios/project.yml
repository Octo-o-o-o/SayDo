name: SayDo
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 5CS6HUB4P2
    SWIFT_VERSION: "5.0"
targets:
  SayDo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SayDo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.octoooo.saydo
        PRODUCT_NAME: SayDo
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: SayDo/Info.plist
      properties:
        CFBundleDisplayName: 说到
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: 扫码配对桌面
        NSLocalNetworkUsageDescription: 连接本机桌面
        NSMicrophoneUsageDescription: 按住说话并在设备上转写
        NSSpeechRecognitionUsageDescription: 将按住说话的内容转成文字并发送给 SayDo
        UILaunchScreen: {}
  SayDoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SayDoTests
    dependencies:
      - target: SayDo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.octoooo.saydo.tests
