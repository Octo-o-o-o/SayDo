<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>支持 · 说到</title>
  <meta name="theme-color" content="#f0ede4" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#12161f" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <script>
    (function () {
      var t = "";
      try { t = localStorage.getItem("saydo.theme") || ""; } catch (e) {}
      if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
      else if (t === "light") document.documentElement.setAttribute("data-theme", "light");
    })();
  </script>
  <link rel="stylesheet" href="/tokens.css" />
  <link rel="stylesheet" href="/site.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand-lockup" href="/">
        <img class="brand-mark" src="/icon-192.png" alt="说到" />
        <span>说到</span>
      </a>
      <nav class="nav" data-nav aria-label="主导航">
        <a class="nav-link" href="/">首页</a>
        <a class="nav-link" href="/privacy/">隐私政策</a>
        <a class="nav-link" href="/terms/">使用条款</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn theme-toggle" data-theme-toggle type="button" aria-label="切换亮暗主题">
          <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        </button>
        <button class="icon-btn menu-toggle" data-menu-toggle type="button" aria-label="打开菜单" aria-expanded="false">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="legal">
    <div class="container">
      <h1>支持</h1>
      <p class="lede">使用问题、隐私请求或商店相关询问，请发邮件。</p>
      <div class="card">
        <p>邮箱：<a href="mailto:support@octoooo.com">support@octoooo.com</a></p>
        <p>开源仓库：<a href="https://github.com/Octo-o-o-o/SayDo">github.com/Octo-o-o-o/SayDo</a></p>
        <p>请说明设备系统版本、是否已完成扫码配对。不要在邮件里粘贴 API key、配对令牌或完整日志。</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-grid">
        <span class="footer-brand">
          <img src="/icon-192.png" alt="" />
          说到 SayDo
        </span>
        <nav class="footer-links" aria-label="页脚导航">
          <a href="/">首页</a>
          <a href="/privacy/">隐私政策</a>
          <a href="/terms/">使用条款</a>
          <a href="mailto:support@octoooo.com">support@octoooo.com</a>
        </nav>
        <div class="footer-meta">© 2026 说到（SayDo）· 开发者 汪义骁 · 本地优先 · 开源 · 隐私至上</div>
      </div>
    </div>
  </footer>

  <script src="/theme.js" defer></script>
</body>
</html>
