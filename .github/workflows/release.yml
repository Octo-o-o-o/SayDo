name: release

on:
  push:
    tags:
      - "v0.1.0-rc.6"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  snapshot:
    name: validate public snapshot tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Re-read remote tag SHA
        shell: bash
        run: |
          remote_tag_sha="$(git ls-remote --exit-code origin "refs/tags/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "${#remote_tag_sha}" -eq 40
          test "${remote_tag_sha}" = "${GITHUB_SHA}"
      - name: Require unique tag workflow history
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-tag-guard.mjs uniqueness --require-current --repo "${GITHUB_REPOSITORY}" --workflow release.yml --tag "${GITHUB_REF_NAME}" --run-id "${GITHUB_RUN_ID}" --head-sha "${GITHUB_SHA}" --run-attempt "${GITHUB_RUN_ATTEMPT}"
      - name: Require tag to be the current public snapshot
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git show -s --format=%s HEAD | grep -Eq '^snapshot: [0-9]{4}-[0-9]{2}-[0-9]{2} from internal [0-9a-f]{40}$'
          declared_tree="$(git show -s --format=%B HEAD | sed -n 's/^public-tree: //p')"
          declared_filter="$(git show -s --format=%B HEAD | sed -n 's/^filter-version: //p')"
          test "${declared_tree}" = "$(git rev-parse 'HEAD^{tree}')"
          test "${declared_filter}" = "public-exclude-v1"
          test "$(git rev-list --parents -n 1 HEAD | wc -w | tr -d ' ')" -le 2
          test ! -e artifacts/release/copyright

  quality-node:
    name: release quality (node and audit)
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install emoji gate scanner
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: bash scripts/check-emoji.sh && bash scripts/test-emoji-gate.sh
      - run: node scripts/check-hardcoded-colors.mjs && node scripts/test-color-gate.mjs
      - run: bash scripts/test-migration-tools.sh
      - run: node scripts/test-release-physical-evidence.mjs
      - run: node scripts/test-release-provenance.mjs
      - run: node scripts/check-doc-links.mjs
      - run: node scripts/third-party-notices.mjs --check
      - run: node scripts/week-audit.mjs --check-bundle
      - run: node scripts/post-release-gate.mjs --check-candidate "${GITHUB_REF_NAME}"

  quality-python:
    name: release quality (python)
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q

  quality-e2e:
    name: release quality (fresh-origin e2e)
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test

  distribution:
    name: release distribution (${{ matrix.os }})
    needs: snapshot
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @saydo/cli verify:distribution

  publish:
    name: publish GitHub prerelease
    needs: [distribution, quality-node, quality-python, quality-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Re-read remote tag SHA
        shell: bash
        run: |
          remote_tag_sha="$(git ls-remote --exit-code origin "refs/tags/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "${#remote_tag_sha}" -eq 40
          test "${remote_tag_sha}" = "${GITHUB_SHA}"
      - name: Require unique tag workflow history
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-tag-guard.mjs uniqueness --require-current --repo "${GITHUB_REPOSITORY}" --workflow release.yml --tag "${GITHUB_REF_NAME}" --run-id "${GITHUB_RUN_ID}" --head-sha "${GITHUB_SHA}" --run-attempt "${GITHUB_RUN_ATTEMPT}"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate tag identity
        shell: bash
        run: |
          package_version="$(node -p "require('./packages/cli/package.json').version")"
          test "v${package_version}" = "${GITHUB_REF_NAME}"
      - name: Build source-bound release assets
        run: node scripts/build-release-artifacts.mjs --write
      - name: Verify source-bound release assets
        run: node scripts/build-release-artifacts.mjs --check
      - name: Create, verify, then publish immutable prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="docs/release/${GITHUB_REF_NAME}.md"
          test -f "${notes_file}"
          pending_notes_file="release-notes.pending.md"
          {
            echo "[fail] PENDING SMOKE: this prerelease is not available for use yet."
            echo "The immutable assets are being checked on macOS, Windows, and Linux."
            echo
            cat "${notes_file}"
          } > "${pending_notes_file}"
          assets_dir="artifacts/release/github/${GITHUB_REF_NAME}"
          expected_names="SHA256SUMS,release-metadata.json,saydo-cli-${GITHUB_REF_NAME#v}.tgz"
          mapfile -t assets < <(find "${assets_dir}" -maxdepth 1 -type f -print | sort)
          test "${#assets[@]}" -eq 3

          existing_draft="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing_draft}" == "true" ]]; then
            gh release delete "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --yes
          elif [[ "${existing_draft}" == "false" ]]; then
            echo "release ${GITHUB_REF_NAME} already published; refusing to replace it" >&2
            exit 1
          fi

          created=false
          published=false
          cleanup_draft() {
            exit_code=$?
            if [[ "${created}" == "true" && "${published}" != "true" ]]; then
              draft_state="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft 2>/dev/null || true)"
              if [[ "${draft_state}" == "true" ]]; then
                gh release delete "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --yes || true
              else
                echo "release state is published or unknown; preserving tag and assets" >&2
              fi
            fi
            exit "${exit_code}"
          }
          trap cleanup_draft EXIT
          remote_tag_sha="$(git ls-remote --exit-code origin "refs/tags/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "${#remote_tag_sha}" -eq 40
          test "${remote_tag_sha}" = "${GITHUB_SHA}"
          node scripts/release-tag-guard.mjs uniqueness --require-current --repo "${GITHUB_REPOSITORY}" --workflow release.yml --tag "${GITHUB_REF_NAME}" --run-id "${GITHUB_RUN_ID}" --head-sha "${GITHUB_SHA}" --run-attempt "${GITHUB_RUN_ATTEMPT}"
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft \
            --prerelease \
            --title "UNAVAILABLE - PENDING SMOKE - SayDo CLI ${GITHUB_REF_NAME#v}" \
            --notes-file "${pending_notes_file}"
          created=true
          gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}"

          release_json="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft,isPrerelease,assets)"
          RELEASE_JSON="${release_json}" EXPECTED_NAMES="${expected_names}" node <<'NODE'
          const release = JSON.parse(process.env.RELEASE_JSON);
          const actual = release.assets.map((asset) => asset.name).sort();
          const expected = process.env.EXPECTED_NAMES.split(",").sort();
          if (!release.isDraft || !release.isPrerelease || JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`draft asset verification failed: ${JSON.stringify({ isDraft: release.isDraft, isPrerelease: release.isPrerelease, actual, expected })}`);
          }
          NODE
          node scripts/release-asset-manifest.mjs --check-dir "${assets_dir}" "${GITHUB_REF_NAME}"
          RELEASE_JSON="${release_json}" node scripts/release-asset-manifest.mjs --check-release-json "${GITHUB_REF_NAME}"
          readback_dir="$(mktemp -d)"
          gh release download "${GITHUB_REF_NAME}" --dir "${readback_dir}" --repo "${GITHUB_REPOSITORY}"
          node scripts/release-asset-manifest.mjs --check-dir "${readback_dir}" "${GITHUB_REF_NAME}"

          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --prerelease
          published=true
          immutable=false
          for _ in {1..10}; do
            immutable="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isImmutable --jq .isImmutable 2>/dev/null || true)"
            [[ "${immutable}" == "true" ]] && break
            sleep 2
          done
          if [[ "${immutable}" != "true" ]]; then
            echo "immutable publication could not be verified; release remains UNAVAILABLE/PENDING" >&2
            exit 1
          fi
          published_json="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft,isPrerelease,isImmutable,assets)"
          RELEASE_JSON="${published_json}" node scripts/release-asset-manifest.mjs --check-release-json "${GITHUB_REF_NAME}"
          published_readback_dir="$(mktemp -d)"
          gh release download "${GITHUB_REF_NAME}" --dir "${published_readback_dir}" --repo "${GITHUB_REPOSITORY}"
          node scripts/release-asset-manifest.mjs --check-dir "${published_readback_dir}" "${GITHUB_REF_NAME}"
          trap - EXIT

  published-smoke:
    name: fixed URL smoke (${{ matrix.os }}, ${{ matrix.mode }})
    needs: publish
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        mode: [exec, global]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Empty-cache fixed URL install and real start/stop
        shell: bash
        run: >-
          node scripts/verify-release-url.mjs
          "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/saydo-cli-${GITHUB_REF_NAME#v}.tgz"
          "${{ matrix.mode }}"

  mark-failed-release:
    name: mark immutable prerelease unavailable when fixed URL smoke fails
    needs: [publish, published-smoke]
    if: ${{ always() && needs.publish.result == 'success' && needs.published-smoke.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Preserve immutable evidence and add an explicit unavailable warning
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_json="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json body)"
          RELEASE_JSON="${release_json}" node <<'NODE' > release-notes.failed.md
          const release = JSON.parse(process.env.RELEASE_JSON);
          process.stdout.write([
            "[fail] This prerelease is unavailable because at least one fixed-URL installation smoke test failed.",
            "Use a later release. The immutable tag and assets are preserved for diagnosis.",
            "",
            release.body ?? ""
          ].join("\n"));
          NODE
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "UNAVAILABLE - SayDo CLI ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.failed.md
          failed_json="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json name,body,isImmutable)"
          FAILED_JSON="${failed_json}" node <<'NODE'
          const release = JSON.parse(process.env.FAILED_JSON);
          if (release.isImmutable !== true || !release.name.startsWith("UNAVAILABLE - ") ||
              !release.body.startsWith("[fail] This prerelease is unavailable")) {
            throw new Error("unavailable release readback mismatch");
          }
          NODE

  mark-release-available:
    name: mark prerelease available after all fixed URL smokes
    needs: [publish, published-smoke]
    if: ${{ needs.publish.result == 'success' && needs.published-smoke.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Re-read remote tag SHA
        shell: bash
        run: |
          remote_tag_sha="$(git ls-remote --exit-code origin "refs/tags/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "${#remote_tag_sha}" -eq 40
          test "${remote_tag_sha}" = "${GITHUB_SHA}"
      - name: Require unique tag workflow history
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-tag-guard.mjs uniqueness --require-current --repo "${GITHUB_REPOSITORY}" --workflow release.yml --tag "${GITHUB_REF_NAME}" --run-id "${GITHUB_RUN_ID}" --head-sha "${GITHUB_SHA}" --run-attempt "${GITHUB_RUN_ATTEMPT}"
      - name: Refuse availability on a rerun attempt
        if: ${{ github.run_attempt != 1 }}
        shell: bash
        run: |
          echo "[fail] a published tag with any failed first attempt stays unavailable; publish a new rc" >&2
          exit 1
      - name: Publish available label and verify readback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes_file="docs/release/${GITHUB_REF_NAME}.md"
          failed_notes_file="release-notes.availability-readback-failed.md"
          confirmed=false
          mark_unavailable_on_failure() {
            exit_code=$?
            if [[ "${confirmed}" != "true" ]]; then
              {
                echo "[fail] This prerelease is unavailable because its available-state readback was not confirmed."
                echo "Use a later release. The immutable tag and assets are preserved for diagnosis."
                echo
                cat "${notes_file}"
              } > "${failed_notes_file}"
              unavailable_confirmed=false
              for _ in {1..6}; do
                gh release edit "${GITHUB_REF_NAME}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --title "UNAVAILABLE - SayDo CLI ${GITHUB_REF_NAME#v}" \
                  --notes-file "${failed_notes_file}" || true
                failed_json="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json name,body 2>/dev/null || true)"
                if FAILED_JSON="${failed_json}" node <<'NODE'
          const raw = process.env.FAILED_JSON;
          if (!raw) process.exit(1);
          const release = JSON.parse(raw);
          if (!release.name.startsWith("UNAVAILABLE - ") ||
              !release.body.startsWith("[fail] This prerelease is unavailable")) process.exit(1);
          NODE
                then
                  unavailable_confirmed=true
                  break
                fi
                sleep 2
              done
              if [[ "${unavailable_confirmed}" != "true" ]]; then
                echo "failed to confirm unavailable fallback after available-state readback failure" >&2
              fi
            fi
            exit "${exit_code}"
          }
          trap mark_unavailable_on_failure EXIT
          remote_tag_sha="$(git ls-remote --exit-code origin "refs/tags/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "${#remote_tag_sha}" -eq 40
          test "${remote_tag_sha}" = "${GITHUB_SHA}"
          node scripts/release-tag-guard.mjs uniqueness --require-current --repo "${GITHUB_REPOSITORY}" --workflow release.yml --tag "${GITHUB_REF_NAME}" --run-id "${GITHUB_RUN_ID}" --head-sha "${GITHUB_SHA}" --run-attempt "${GITHUB_RUN_ATTEMPT}"
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "SayDo CLI ${GITHUB_REF_NAME#v}" \
            --notes-file "${notes_file}"
          available_json="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json name,body,isImmutable,isDraft,isPrerelease)"
          AVAILABLE_JSON="${available_json}" NOTES_FILE="${notes_file}" node <<'NODE'
          const fs = require("node:fs");
          const release = JSON.parse(process.env.AVAILABLE_JSON);
          const notes = fs.readFileSync(process.env.NOTES_FILE, "utf8").trimEnd();
          const expectedTitle = `SayDo CLI ${process.env.GITHUB_REF_NAME.slice(1)}`;
          if (release.isImmutable !== true || release.isDraft !== false || release.isPrerelease !== true ||
              release.name !== expectedTitle || release.body.trimEnd() !== notes) {
            throw new Error("available release readback mismatch");
          }
          NODE
          confirmed=true
          trap - EXIT
