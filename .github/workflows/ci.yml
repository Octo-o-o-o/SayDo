name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 版本由 package.json 的 packageManager 字段提供;再传 version 会被 action 判为冲突。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install emoji gate scanner
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: emoji gate (docs/11 s12)
        run: bash scripts/check-emoji.sh && bash scripts/test-emoji-gate.sh
      - name: migration tools self-test
        run: bash scripts/test-migration-tools.sh

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
