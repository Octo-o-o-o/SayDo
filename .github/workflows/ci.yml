name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    # GitHub-supported versioned image alias, not a content-addressed snapshot.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # 版本由 package.json 的 packageManager 字段提供;再传 version 会被 action 判为冲突。
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Major pin only; patch is whatever this pinned setup-node SHA resolves for 22.
          node-version: 22
          cache: pnpm
      - name: Install emoji gate scanner
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: emoji gate (docs/11 s12)
        run: bash scripts/check-emoji.sh && bash scripts/test-emoji-gate.sh
      - name: design-token color gate
        run: node scripts/check-hardcoded-colors.mjs && node scripts/test-color-gate.mjs
      - name: migration tools self-test
        run: bash scripts/test-migration-tools.sh
      - name: physical release evidence gate self-test
        run: node scripts/test-release-physical-evidence.mjs
      - name: release provenance and state self-test
        run: node scripts/test-release-provenance.mjs
      - name: document and release metadata gates
        run: |
          node scripts/check-doc-links.mjs
          node scripts/third-party-notices.mjs --check
          node scripts/week-audit.mjs --check-bundle
      - name: mobile installer and release-contract self-tests
        run: |
          node scripts/test-pairing-url-corpus.mjs
          node scripts/test-mobile-installers.mjs
          node scripts/test-mobile-release-contract.mjs

  console-e2e:
    name: console fresh-origin e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Major pin only; patch is whatever this pinned setup-node SHA resolves for 22.
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test

  python:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q

  distribution:
    name: distribution (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Major pin only; patch is whatever this pinned setup-node SHA resolves for 22.
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @saydo/cli verify:distribution

  # HarmonyOS: no standard GitHub-hosted DevEco / signing Profile runner.
  # Do not add a fake-green job. Local gate only; see docs/release/version-matrix.md.

  android-shell:
    name: android shell
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - name: Install Android API 36
        run: sdkmanager --install "platforms;android-36"
      - name: Unit test, lint, assembleDebug
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

  ios-shell:
    name: ios shell
    # macos-15 is a GitHub versioned image alias, not a pinned Xcode/xcodegen snapshot.
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install XcodeGen
        # Homebrew formula is not content-addressed; record the resolved version in logs.
        run: |
          brew install xcodegen
          xcodegen --version
      - name: Generate Xcode project and unsigned simulator build
        working-directory: apps/ios
        run: |
          xcodegen generate
          xcodebuild \
            -project SayDo.xcodeproj \
            -scheme SayDo \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build-simulator \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: XCTest on an available iPhone simulator
        working-directory: apps/ios
        run: |
          DEST="$(node ../../scripts/select-ios-simulator.mjs)"
          xcodebuild \
            -project SayDo.xcodeproj \
            -scheme SayDo \
            -destination "$DEST" \
            -derivedDataPath .build-simulator \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            test
