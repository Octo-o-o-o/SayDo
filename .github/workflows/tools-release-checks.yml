name: tools and release checks

on:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - "packages/*/package.json"
      - "packages/cli/THIRD_PARTY_NOTICES.md"
      - "apps/**"
      - "deploy/saydo-octoooo-com/**"
      - "README.md"
      - "e2e/evidence/*-availability.json"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - "packages/*/package.json"
      - "packages/cli/THIRD_PARTY_NOTICES.md"
      - "apps/**"
      - "deploy/saydo-octoooo-com/**"
      - "README.md"
      - "e2e/evidence/*-availability.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:tools
      - run: pnpm test:release
