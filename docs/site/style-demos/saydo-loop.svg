<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="640" height="470">
  <!-- 说到环线 SAYDO LOOP · 闭环运行图 · 独立资产（色板：宣纸/松烟墨/矿彩四色/印泥朱） -->
  <rect width="640" height="470" fill="#faf7ef"/>
  <!-- 轨道 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M140 80 L500 80" stroke="#3c5f96" stroke-width="7"/>
    <path d="M500 80 L570 150 L570 225" stroke="#3c5f96" stroke-width="7"/>
    <path d="M570 225 L570 300 L500 370" stroke="#a8641f" stroke-width="7"/>
    <path d="M500 370 L140 370" stroke="#41755a" stroke-width="7"/>
    <path d="M140 370 L70 300 L70 225" stroke="#41755a" stroke-width="7"/>
    <path d="M70 225 L70 150 L140 80" stroke="#a29b8f" stroke-width="5" stroke-dasharray="2 12"/>
  </g>
  <!-- 计费区环 -->
  <circle cx="320" cy="225" r="126" fill="none" stroke="#a29b8f" stroke-width="1.2" stroke-dasharray="4 6" opacity=".55"/>
  <text x="178" y="110" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" letter-spacing="1" fill="#706b61" opacity=".7">一票通 zone 1</text>
  <!-- 指北针 -->
  <g transform="translate(604,42)">
    <circle r="15" fill="#faf7ef" stroke="#34332e" stroke-width="1.5"/>
    <path d="M0 -9 L4.5 5 L0 2 L-4.5 5 Z" fill="#b13a2b"/>
    <text y="-19" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#34332e">N</text>
  </g>
  <!-- 支线：预算封顶 -->
  <path d="M500 388 L500 446" stroke="#a8641f" stroke-width="3.5" stroke-dasharray="3 6" fill="none"/>
  <circle cx="500" cy="450" r="6.5" fill="#faf7ef" stroke="#a8641f" stroke-width="3"/>
  <text x="514" y="448" font-family="'PingFang SC',sans-serif" font-size="12.5" font-weight="600" fill="#34332e">预算封顶</text>
  <text x="514" y="462" font-family="ui-monospace,monospace" font-size="8.5" letter-spacing="1" fill="#a29b8f">BUDGET CAP</text>
  <!-- 中心环名 -->
  <text x="320" y="222" text-anchor="middle" font-family="'Songti SC','Noto Serif SC',serif" font-weight="700" font-size="26" letter-spacing="4" fill="#34332e">說到環線</text>
  <text x="320" y="246" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" letter-spacing="3" fill="#706b61">SAYDO · LOOP</text>
  <!-- 图例 -->
  <g>
    <rect x="238" y="272" width="164" height="82" rx="6" fill="#faf7ef" stroke="#cec6b7"/>
    <text x="320" y="289" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" letter-spacing="2" fill="#706b61">图例 LEGEND</text>
    <line x1="252" y1="301" x2="272" y2="301" stroke="#a8641f" stroke-width="4" stroke-linecap="round"/>
    <text x="280" y="305" font-family="'PingFang SC',sans-serif" font-size="10.5" fill="#34332e">赭 · 等你拍板</text>
    <line x1="252" y1="317" x2="272" y2="317" stroke="#3c5f96" stroke-width="4" stroke-linecap="round"/>
    <text x="280" y="321" font-family="'PingFang SC',sans-serif" font-size="10.5" fill="#34332e">黛 · 你欠的动作</text>
    <line x1="252" y1="333" x2="272" y2="333" stroke="#41755a" stroke-width="4" stroke-linecap="round"/>
    <text x="280" y="337" font-family="'PingFang SC',sans-serif" font-size="10.5" fill="#34332e">松 · AI 正在办</text>
    <line x1="252" y1="349" x2="272" y2="349" stroke="#a29b8f" stroke-width="3" stroke-dasharray="2 4"/>
    <text x="280" y="353" font-family="'PingFang SC',sans-serif" font-size="10.5" fill="#34332e">灰 · 等外部回音</text>
  </g>
  <!-- 列车 -->
  <circle r="9" fill="#b13a2b" stroke="#faf7ef" stroke-width="3">
    <animateMotion dur="14s" repeatCount="indefinite" path="M140 80 L500 80 L570 150 L570 300 L500 370 L140 370 L70 300 L70 150 Z"/>
  </circle>
  <!-- 车站 -->
  <g>
    <circle cx="140" cy="80" r="10" fill="#faf7ef" stroke="#34332e" stroke-width="4"/>
    <text x="140" y="52" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="14.5" font-weight="600" fill="#34332e">开口聊</text>
    <text x="140" y="36" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" letter-spacing="1" fill="#a29b8f">SPEAK</text>
  </g>
  <g>
    <circle cx="500" cy="80" r="10" fill="#faf7ef" stroke="#34332e" stroke-width="4"/>
    <text x="500" y="52" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="14.5" font-weight="600" fill="#34332e">就绪决断</text>
    <text x="500" y="36" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" letter-spacing="1" fill="#a29b8f">READY?</text>
  </g>
  <g>
    <circle cx="570" cy="225" r="10" fill="#faf7ef" stroke="#34332e" stroke-width="4"/>
    <text x="554" y="220" text-anchor="end" font-family="'PingFang SC',sans-serif" font-size="14.5" font-weight="600" fill="#34332e">决策包</text>
    <text x="554" y="236" text-anchor="end" font-family="ui-monospace,monospace" font-size="8.5" letter-spacing="1" fill="#a29b8f">DECISION PKG</text>
  </g>
  <g>
    <circle cx="500" cy="370" r="15" fill="none" stroke="#b13a2b" stroke-width="3.5"/>
    <circle cx="500" cy="370" r="8" fill="#b13a2b"/>
    <text x="478" y="388" text-anchor="end" font-family="'PingFang SC',sans-serif" font-size="14.5" font-weight="700" fill="#b13a2b">你拍板 · 换乘</text>
    <text x="478" y="404" text-anchor="end" font-family="ui-monospace,monospace" font-size="8.5" letter-spacing="1" fill="#a29b8f">YOU DECIDE — INTERCHANGE</text>
  </g>
  <g>
    <circle cx="140" cy="370" r="10" fill="#faf7ef" stroke="#34332e" stroke-width="4"/>
    <text x="140" y="414" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="14.5" font-weight="600" fill="#34332e">后台执行</text>
    <text x="140" y="430" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" letter-spacing="1" fill="#a29b8f">EXECUTE</text>
  </g>
  <g>
    <circle cx="70" cy="225" r="10" fill="#faf7ef" stroke="#34332e" stroke-width="4"/>
    <text x="86" y="220" font-family="'PingFang SC',sans-serif" font-size="14.5" font-weight="600" fill="#34332e">叫你验收</text>
    <text x="86" y="236" font-family="ui-monospace,monospace" font-size="8.5" letter-spacing="1" fill="#a29b8f">ACCEPTANCE</text>
  </g>
  <!-- 边角注记 -->
  <text x="24" y="458" font-family="ui-monospace,monospace" font-size="9" letter-spacing="1.5" fill="#a29b8f">SAYDO TRANSIT · FIG.02</text>
  <text x="616" y="458" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" letter-spacing="1.5" fill="#a29b8f">说到，就做到</text>
</svg>
