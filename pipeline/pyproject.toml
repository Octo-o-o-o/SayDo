[project]
name = "saydo-pipeline"
version = "0.0.1"
description = "SayDo 语音管线(A1:VAD/流式 ASR/分句 TTS/打断;无状态,经 WS 与 daemon 通信)"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai>=1.6.0",
    "websockets>=16.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saydo_pipeline"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
