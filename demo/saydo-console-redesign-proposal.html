<!--
  SayDo Console 重设计提案 v2（2026-08-07）
  性质：设计提案 demo，全 mock，独立于 canonical demo/saydo-console-demo.html。
  mock 数据形状对齐 docs/09-data-contracts.md、packages/contracts、Focus Contract v0.3.6：
  Focus / Obligation(7态) / Task(16呈现态) / ApprovalReceipt / AttentionItem / Money /
  EffectGrant / focus_artifacts(expected→deliverable) / focus_project_refs / FocusLane。
  v2 变更：Focus 页加右栏实体列表（安排/产物/项目/记忆）；新增全景看板（泳道=Focus）；
  空间管理；待命与唤醒（sparse agent）演示；邮件推送概念（P1 提案）；全部控件可点。
  硬约束：零 emoji、状态词三级、11 §2.6 四联映射、S3 仅屏幕强认证、禁伪精确、中性二选一。
-->

.board{overflow-x:auto}
.board > *{min-width:980px}
.board-cols-header{display:grid;grid-template-columns:140px repeat(4,minmax(190px,1fr));gap:8px;margin-bottom:var(--space-2)}
.board-head{font-size:var(--text-xs);color:var(--text-muted);padding:6px 8px}
.lane-group{border:1px solid var(--glass-border);border-radius:var(--radius-lg);background:var(--surface-glass-soft);margin-bottom:var(--space-4)}
.lane-group-head{display:flex;align-items:center;gap:var(--space-3);padding:10px 14px;cursor:pointer;user-select:none}
.lane-group-head:hover{background:var(--surface-ink-wash);border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.lane-subrow{display:grid;grid-template-columns:140px repeat(4,minmax(190px,1fr));gap:8px;padding:0 8px 8px}
.lane-subtitle{font-size:var(--text-xs);color:var(--text-muted);padding:8px 6px;display:flex;gap:4px;align-items:center}
.lane-cell{min-height:52px;padding:4px;border-radius:var(--radius-md);background:var(--surface-ink-wash);display:flex;flex-direction:column;gap:6px}
.board-card{padding:8px 10px;border-radius:var(--radius-sm);border:1px solid var(--glass-border);background:var(--surface-glass-strong);font-size:var(--text-xs);cursor:pointer;text-align:left;width:100%}
.board-card:hover{box-shadow:var(--shadow-card-hover)}
.board-card .t{font-size:var(--text-sm);font-weight:500;line-height:1.4;margin-bottom:4px}
.board-card .meta{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.board-more{font-size:var(--text-xs);color:var(--active-ink);padding:5px 8px;text-align:left;border-radius:var(--radius-xs)}
.board-more:hover{background:var(--surface-glass-strong)}
.dl{display:inline-flex;align-items:center;gap:0}
.dl-dot{width:8px;height:8px;border-radius:50%;background:var(--active-ink);flex:none}
.dl-dot.cur{background:var(--color-warning)}
.dl-line{width:16px;height:1.5px;background:var(--glass-border-bright);flex:none}
/* 验收面 */
.review-grid{display:grid;grid-template-columns:300px 1fr;gap:var(--space-5);align-items:start;margin-top:var(--space-4)}
@media (max-width:980px){.review-grid{grid-template-columns:1fr}}
.ac-item{display:flex;gap:var(--space-2);padding:10px var(--space-3);border-radius:var(--radius-sm);border:1px solid var(--glass-border);margin-bottom:var(--space-2);cursor:pointer;width:100%;text-align:left;font-size:var(--text-sm)}
.ac-item.active{border-color:var(--active-ink);background:var(--active-ink-wash)}
.ac-pass{color:var(--color-success)} .ac-fail{color:var(--color-error)} .ac-unknown{color:var(--text-faint)}
.ac-hollow{color:var(--color-success);opacity:.7;border:1.5px dashed var(--color-success);border-radius:50%;width:18px;height:18px;display:inline-grid;place-items:center;flex:none}
.diff{font-family:var(--font-mono);font-size:var(--text-xs);line-height:1.7;background:var(--code-block-bg);border:1px solid var(--glass-border);border-radius:var(--radius-sm);padding:var(--space-3);overflow-x:auto;white-space:pre}
.article-view{background:var(--code-block-bg);border:1px solid var(--glass-border);border-radius:var(--radius-sm);padding:var(--space-4);font-size:var(--text-sm);line-height:1.9;max-height:320px;overflow-y:auto}
.diff .add{color:var(--color-success)} .diff .del{color:var(--color-error)} .diff .hunk{color:var(--color-info)}
.decision-row{display:flex;gap:var(--space-3);align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--glass-border);font-size:var(--text-sm)}
.decision-row:last-child{border-bottom:none}
.appr-context{font-size:var(--text-xs);color:var(--text-muted);display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center}
.trust-badge{font-size:11px;padding:3px 10px;border-radius:var(--radius-pill);border:1px solid;flex:none;white-space:nowrap;line-height:1.4;margin-top:2px}
.mem-candidate{background:var(--surface-ink-wash);border:1px dashed var(--glass-border-bright);border-radius:var(--radius-sm);padding:var(--space-3) var(--space-3);margin:0 calc(0px - var(--space-2))}
.mem-actions{display:flex;gap:6px;flex:none;align-items:center}
.trust-user_stated{color:var(--active-ink);border-color:var(--active-ink)}
.trust-user_approved{color:var(--color-success);border-color:var(--color-success)}
.trust-auto_low_impact{color:var(--text-muted);border-color:var(--text-muted)}
.trust-candidate{color:var(--text-faint);border-color:var(--text-faint);border-style:dashed}
.mem-row{display:flex;gap:var(--space-3);padding:var(--space-3) 0;border-bottom:1px dashed var(--glass-border);font-size:var(--text-sm);align-items:flex-start}
.mem-row:last-child{border-bottom:none}
table.data{width:100%;border-collapse:collapse;font-size:var(--text-sm)}
table.data th{text-align:left;color:var(--text-muted);font-weight:500;font-size:var(--text-xs);padding:6px var(--space-2);border-bottom:1px solid var(--glass-border)}
table.data td{padding:10px var(--space-2);border-bottom:1px dashed var(--glass-border);vertical-align:top}
table.data tr:last-child td{border-bottom:none}
table.data tr[data-art]{cursor:pointer}
table.data tr[data-art]:hover td{background:var(--surface-ink-wash)}
.budget-bar{height:6px;border-radius:3px;background:var(--surface-ink-wash);overflow:hidden;margin-top:6px}
.budget-bar i{display:block;height:100%;border-radius:3px;background:var(--active-ink)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:99;background:var(--surface-glass-strong);backdrop-filter:blur(var(--glass-blur));border:1px solid var(--glass-border);border-radius:var(--radius-md);padding:10px 18px;box-shadow:var(--shadow-card-hover);font-size:var(--text-sm);display:flex;gap:var(--space-2);align-items:center;animation:toastin var(--duration-base) var(--ease-out);max-width:70vw}
@keyframes toastin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
/* Focus 页双栏独立滚动：对话流动，右栏稳定 */
#main.main-locked{overflow:hidden;display:flex;flex-direction:column}
#main.main-locked .page{height:100%;display:flex;flex-direction:column}
#main.main-locked .focus-layout{flex:1;min-height:0}
.convo-col{overflow-y:auto;min-height:0;max-height:100%;padding-right:6px}
.convo-col .statecard{top:0}
#main.main-locked .rail{overflow-y:auto;min-height:0;max-height:100%;position:static;padding-bottom:var(--space-5)}
.tl-flash{animation:tlflash 1.8s var(--ease-out)}
@keyframes tlflash{0%{box-shadow:0 0 0 3px var(--active-ink)}100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}}
#proposal-banner{position:relative;z-index:10;background:var(--text-primary);color:var(--bg-app);font-size:var(--text-xs);padding:6px var(--shell-gutter);display:flex;gap:var(--space-4);align-items:center;flex-wrap:wrap}
#proposal-banner a{color:inherit;opacity:0.75;text-decoration:underline}
#proposal-banner .sep{opacity:0.3}
#design-notes{background:var(--surface-glass-strong);border-bottom:1px solid var(--glass-border);position:relative;z-index:10;padding:var(--space-4) var(--shell-gutter);display:none;font-size:var(--text-sm);max-height:60vh;overflow-y:auto}
#design-notes.open{display:block}
#design-notes .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:var(--space-5);max-width:1500px}
#design-notes h4{font-size:var(--text-sm);margin-bottom:6px;color:var(--active-ink)}
#design-notes ul{padding-left:18px;color:var(--text-secondary)}
#design-notes li{margin-bottom:3px}
#design-notes code{font-family:var(--font-mono);font-size:0.9em;background:var(--code-bg);padding:0 4px;border-radius:4px}
.topbar-spacer{flex:1}
.voice-pill{display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-sm);padding:5px 12px;border-radius:var(--radius-pill);border:1px solid var(--active-ink-border);background:var(--active-ink-wash);color:var(--active-ink);cursor:pointer}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:var(--radius-xs);color:var(--text-secondary);position:relative}
.icon-btn:hover{background:var(--surface-ink-wash);color:var(--text-primary)}
.bell-dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--color-warning)}
.dropdown{position:absolute;top:calc(var(--h-titlebar) - 4px);right:var(--shell-gutter);width:400px;max-height:480px;overflow-y:auto;z-index:50;padding:var(--space-3)}
.dropdown-item{padding:var(--space-3);border-radius:var(--radius-sm);font-size:var(--text-sm)}
.dropdown-item:hover{background:var(--surface-ink-wash)}
.empty{padding:var(--space-6);text-align:center;color:var(--text-muted);font-size:var(--text-sm)}
/* 弹窗 */
.modal-overlay{position:fixed;inset:0;z-index:80;background:rgba(18,22,31,0.32);display:grid;place-items:center;animation:toastin2 var(--duration-fast) var(--ease-out)}
@keyframes toastin2{from{opacity:0}to{opacity:1}}
.modal{width:min(680px,92vw);max-height:84vh;overflow-y:auto;padding:var(--space-5)}
.modal .h-sec{margin-bottom:var(--space-3)}
.modal-row{display:flex;gap:var(--space-2);margin-top:var(--space-4);flex-wrap:wrap;align-items:center}
.field{margin-bottom:var(--space-3)}
.field label{display:block;font-size:var(--text-xs);color:var(--text-muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--glass-border);border-radius:var(--radius-sm);background:var(--control-glass);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--active-ink-border)}
.kv{display:flex;gap:var(--space-2);font-size:var(--text-sm);padding:5px 0;border-bottom:1px dashed var(--glass-border)}
.kv:last-child{border-bottom:none}
.kv .k{width:88px;flex:none;color:var(--text-muted);font-size:var(--text-xs);padding-top:2px}
.opt-btn{display:block;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--glass-border);border-radius:var(--radius-sm);margin-bottom:6px;font-size:var(--text-sm)}
.opt-btn:hover{border-color:var(--active-ink);background:var(--active-ink-wash)}
.email-frame{border:1px solid var(--glass-border);border-radius:var(--radius-sm);overflow:hidden;font-size:var(--text-sm)}
.email-head{background:var(--surface-ink-wash);padding:10px 14px;border-bottom:1px solid var(--glass-border)}
.email-body{padding:14px}
</style>
</head>

  parked:{label:'停靠等你',tone:'warning',icon:'pause'}
};
const TONE_CLASS = {muted:'st-muted',info:'st-info',warning:'st-warning',error:'st-error',success:'st-success',ink:'st-ink-filled','ink-wash':'st-ink-wash'};
function statusChip(status, deadline){
  const s = CHIP_TABLE[status] || {label:status, tone:'muted', icon:'help'};
  const dl = (status==='parked' && deadline) ? ` <span class="mono" style="opacity:.8">${deadline.slice(5,10)}止</span>` : '';
  return `<span class="chip ${TONE_CLASS[s.tone]}">${icon(s.icon,12,s.breathing?'breathing':'')}${s.label}${dl}</span>`;
}
function riskBadge(risk){
  if(risk==='S2') return `<span class="tag" style="color:var(--color-warning);border-color:var(--color-warning)">${icon('shield',11)} S2</span>`;
  if(risk==='S3') return `<span class="tag" style="color:#fff;background:var(--color-error);border-color:var(--color-error)">${icon('shieldAlert',11)} S3</span>`;
  return `<span class="tag" style="border-color:transparent">${risk}</span>`;
}

function renderSidebar(route){
  const needCount = DB.attention.filter(a=>a.color==='orange' && !state.attnAck[a.id]).length;
  const spacesHtml = DB.spaces.map(sp=>{
    const fs = DB.focuses.filter(f=>f.spaceId===sp.id && f.lifecycle!=='archived');
    if(!fs.length) return '';
    const col = state.spaceCollapsed[sp.id];
    const head = `<div class="nav-sec"><button data-space-col="${sp.id}" title="折叠/展开">${icon(col?'chevronRight':'chevronDown',11)} ${esc(sp.title)}</button></div>`;
    if(col) return head;
    return head + fs.map(f=>{
      const need = needBadgeCount(f.id);
      const hot = need>0 && (f.lifecycle==='active'||f.lifecycle==='captured');
      const dotColor = f.lifecycle==='active' ? (hot?'var(--color-warning)':'var(--color-success)')
        : f.lifecycle==='captured' ? 'var(--color-info)'
        : 'var(--text-faint)';
      return `<button class="nav-item ${route==='#/focus/'+f.id?'active':''}" data-go="#/focus/${f.id}">
        <span class="dot" style="background:${dotColor}"></span>
        <span class="grow">${esc(f.title)}</span>
        ${hot?`<span class="count-pill" style="background:var(--color-warning)">${need}</span>`:''}
      </button>`;
    }).join('');
  }).join('');
  $('#sidebar').innerHTML = `
    <div class="brand"><span class="brand-mark">${icon('zap',13)}</span>SayDo</div>
    <div class="side-action"><button class="btn btn-primary" style="width:100%;justify-content:center" data-go="#/chat-new">${icon('mic',14)} 开口聊</button></div>

        ${needCount?`<span class="count-pill">${needCount}</span>`:''}
      </button>
      <button class="nav-item ${route==='#/board'?'active':''}" data-go="#/board">
        ${icon('grid',15)}<span class="grow">全景看板</span>
      </button>
      <div class="nav-sec"><span>正在持续的事</span><button id="btn-new-focus" title="新 Focus">${icon('plus',13)}</button></div>
      ${spacesHtml}
      <div class="nav-sec"><span>记录</span></div>
      <button class="nav-item ${route==='#/memory'?'active':''}" data-go="#/memory">${icon('book',15)}<span class="grow">记忆库</span></button>
      <button class="nav-item ${route==='#/artifacts'?'active':''}" data-go="#/artifacts">${icon('pkg',15)}<span class="grow">产物库</span></button>
      <button class="nav-item ${route==='#/cost'?'active':''}" data-go="#/cost">${icon('wallet',15)}<span class="grow">成本</span></button>
      <button class="nav-item ${route==='#/settings'?'active':''}" data-go="#/settings">${icon('sliders',15)}<span class="grow">设置</span></button>
    </nav>
    <div class="side-foot">单用户 · 本机 daemon <span class="mono">127.0.0.1:47100</span></div>`;
  $('#sidebar').querySelectorAll('[data-space-col]').forEach(el=> el.onclick = ()=>{
    const sp = el.dataset.spaceCol;
    state.spaceCollapsed[sp] = !state.spaceCollapsed[sp];
    rerenderMain();
  });

/* 橙区排序 = canonical docs/11 §3 修订案（2026-08-08）：
   ready_for_review > 审批/确认卡 > blocked > blocking 挂账义务 > 其余（呈现层二次排序，daemon 不改） */
function orangeRank(a){
  const t = a.refId ? taskById(a.refId) : null;
  if(t && t.viewStatus==='ready_for_review') return 0;
  if(a.sourceKind==='confirmation'||a.sourceKind==='approval') return 1;
  if(t && ['blocked','paused_step_boundary','waiting_confirmation','merge_failed','failed'].includes(t.viewStatus)) return 2;
  if(a.sourceKind==='obligation' && obById(a.refId) && obById(a.refId).blocking) return 3;
  return 4;
}
const ORANGE_CAP = 5;
function renderToday(){
  const vis = DB.attention.filter(a=>!state.attnAck[a.id]);
  const orangeAll = vis.filter(a=>a.color==='orange')
    .sort((x,y)=> orangeRank(x)-orangeRank(y) || new Date(y.updatedAt)-new Date(x.updatedAt));
  const orange = state.orangeExpanded ? orangeAll : orangeAll.slice(0, ORANGE_CAP);
  const orangeMore = orangeAll.length - orange.length;
  const blue = vis.filter(a=>a.color==='blue');
  const green = vis.filter(a=>a.color==='green');
  const gray = vis.filter(a=>a.color==='gray');
  return `<div class="page">
    <div style="display:flex;align-items:baseline;gap:var(--space-3);margin-bottom:var(--space-4)">
      <span class="h-page">今天</span>
      <span class="muted small">${orangeAll.length} 件需要你${blue.length?` · ${blue.length} 件等你的动作`:''} · ${green.length} 件我在做</span>
    </div>
    <div class="today-grid">
      <section>
        <div class="h-sec" style="margin-bottom:var(--space-3);color:var(--color-warning)">${icon('flag',14)} 需要你</div>
        ${orange.map(attnItem).join('') || '<div class="empty">没有需要你的事</div>'}
        ${orangeMore>0?`<button class="board-more" data-orange-more="1">还有 ${orangeMore} 条（按 验收 > 审批确认 > 卡住 > 挂账义务 排）</button>`:''}
        ${state.orangeExpanded&&orangeAll.length>ORANGE_CAP?`<button class="board-more" data-orange-less="1">收起</button>`:''}
        ${blue.length?`<div class="h-sec" style="margin:var(--space-4) 0 var(--space-3);color:var(--active-ink)">${icon('user',14)} 等你的动作</div>${blue.map(attnItem).join('')}`:''}
      </section>
      <section>
        <div class="h-sec" style="margin-bottom:var(--space-3);color:var(--color-success)">${icon('loader',14)} 我在做，你不用管</div>
        ${green.map(attnItem).join('') || '<div class="empty">手上暂时没有活</div>'}
        <div class="h-sec" style="margin:var(--space-4) 0 var(--space-3);color:var(--text-muted)">${icon('hourglass',14)} 等外部（我在待命，到了会叫你）</div>
        ${gray.map(attnItem).join('') || '<div class="empty">没有等外部的事</div>'}
        <div class="card card-pad" style="margin-top:var(--space-4)">
          <div class="h-sec" style="margin-bottom:var(--space-3)">继续聊</div>
          <div class="focus-quick">
            ${(()=>{
              const fs = DB.focuses.filter(f=>['active','captured','dormant'].includes(f.lifecycle))
                .sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
              const shown = state.quickExpanded ? fs : fs.slice(0,5);
              return shown.map(f=>{
                const ob = openByOwner(f.id);
                const joined = [ob.human?`你 ${ob.human} 件`:'', ob.agent?`我 ${ob.agent} 件`:'', ob.external?`等外部 ${ob.external} 件`:''].filter(Boolean).join(' · ') || '没有未结的事';
                return `<button class="focus-quick-item" data-go="#/focus/${f.id}">
                  <span class="dot" style="background:${ob.human?'var(--color-warning)':f.lifecycle==='dormant'?'var(--text-faint)':'var(--color-success)'}"></span>
                  <span style="flex:1;min-width:0"><span style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.title)}</span>
                  <span class="xs faint">${joined}</span></span>
                  ${icon('chevronRight',13)}
                </button>`;

}

function boardColumnOf(t){
  if(['queued','confirmed'].includes(t.viewStatus)) return 0;
  if(['running','merging','superseded'].includes(t.viewStatus) && t.viewStatus!=='superseded') return 1;
  if(['paused_step_boundary','blocked','waiting_confirmation','ready_for_review','review_approved_waiting_merge','merge_failed','failed','parked'].includes(t.viewStatus)) return 2;
  return 3;
}
function boardCard(t){
  const proj = projById(t.projectRef);
  return `<button class="board-card" data-board-task="${t.id}">
    <div class="t">${esc(t.title)}</div>
    <div class="meta">${statusChip(t.viewStatus, t.parkedDeadline)} ${riskBadge(t.riskLevel)}</div>
    <div class="meta" style="margin-top:4px">${proj?`<span class="proj-badge">${icon('folder',10)} ${esc(proj.title)}</span>`:''}<span class="tag mono">${t.route==='hopper'?'HP':'T1'}</span></div>
  </button>`;
}
function obCard(o){
  return `<button class="board-card" data-board-ob="${o.id}">
    <div class="t">${esc(o.title)}</div>
    <div class="meta"><span class="chip st-warning">${icon('user',11)} ${NEEDS_LABEL[o.needs]||'等你'}</span></div>
  </button>`;
}
function renderBoard(){
  const cols = ['队列 / 收到','进行中','需要你','已收尾'];
  const focuses = DB.focuses.filter(f=>['active','captured','dormant'].includes(f.lifecycle));
  const CELL_CAP = 4;
  const cellHtml = (htmls, key)=>{
    const expanded = state.boardExpand[key];
    const shown = expanded ? htmls : htmls.slice(0, CELL_CAP);
    const more = htmls.length - shown.length;
    return shown.join('') + (more>0 ? `<button class="board-more" data-bexpand="${key}">+ ${more} 张，展开</button>` : '');
  };
  return `<div class="page" style="max-width:1360px">
    <div style="display:flex;align-items:baseline;gap:var(--space-3);margin-bottom:var(--space-4)">
      <span class="h-page">全景看板</span>
      <span class="muted small">按 Focus 分组，多条支线拆子泳道 · 你只需要看「需要你」那一列 · 格子多了会折叠</span>
    </div>
    <div class="board">
      <div class="board-cols-header">
        <div></div>${cols.map((c,i)=>`<div class="board-head" style="${i===2?'color:var(--color-warning);font-weight:600':''}">${c}</div>`).join('')}
      </div>
      ${focuses.map(f=>{
        const fl = (f.lanes && f.lanes.length ? f.lanes : [{id:'lan_main', title:'主线'}]).filter(l=>!l.retiredAt);
        const collapsed = state.boardCollapsed[f.id] ?? (f.lifecycle==='dormant');
        const myTasks = DB.tasks.filter(t=>t.focusId===f.id);
        const myObs = openObs(f.id);
        const needCount = needBadgeCount(f.id);
        return `<div class="lane-group">
          <div class="lane-group-head" data-bcollapse="${f.id}">
            <strong>${esc(f.title)}</strong>
            <span class="tag">${{active:'进行中',captured:'刚记下',dormant:'休眠中'}[f.lifecycle]}</span>
            ${fl.length>1?`<span class="xs" style="color:var(--active-ink)">${icon('layers',11)} ${fl.length} 条支线</span>`:''}
            <span class="topbar-spacer"></span>
            ${needCount?`<span class="count-pill" style="background:var(--color-warning)">${needCount}</span>`:'<span class="xs faint">没有需要你的</span>'}
            ${icon(collapsed?'chevronRight':'chevronDown',14)}
          </div>
          ${collapsed?'':fl.map(lane=>{
            const ts = myTasks.filter(t=>(t.laneId||'lan_main')===lane.id);
            const obs = myObs.filter(o=>o.owner==='human' && (o.laneId||'lan_main')===lane.id);
            return `<div class="lane-subrow">
              <div class="lane-subtitle">${fl.length>1?icon('layers',10):''} ${esc(lane.title)}</div>
              ${[0,1,2,3].map(ci=>{
                const cards = [...ts.filter(t=>boardColumnOf(t)===ci).map(boardCard), ...(ci===2?obs.map(obCard):[])];
                return `<div class="lane-cell">${cellHtml(cards, f.id+':'+lane.id+':'+ci)}</div>`;
              }).join('')}
            </div>`;
          }).join('')}
        </div>`;
      }).join('')}
    </div>
    <div class="xs faint" style="margin-top:var(--space-3)">「已收尾」含已交付 / 停了 / 已被替代 · HP = Hopper 执行域投影 · 休眠的事默认收起，点组头展开</div>
  </div>`;
}
</script>

          <div class="xs muted" style="margin-top:4px">每到一个计划步边界就停下来，你确认了再走。第一次合作建议这样。</div>
        </button>
        <button class="mode-card ${state.pkgMode==='direct'?'selected':''}" data-mode="direct">
          <div style="font-weight:500">一口气跑完 <span class="stage-tag">P0.5</span></div>
          <div class="xs muted" style="margin-top:4px">中间不打扰你，跑完直接等你验收。熔断条件不变。</div>
        </button>
      </div>
      <div style="display:flex;gap:var(--space-2);margin-top:var(--space-4);align-items:center;flex-wrap:wrap">
        <button class="btn btn-primary" id="pkg-approve" ${state.pkgMode?'':'disabled'}>拍板，开始</button>
        <button class="btn" id="pkg-expect">改期待</button>
        <button class="btn" id="pkg-revise">还要改改</button>
        <span class="xs faint">不置可否就按「每步问你」处理 · 二选一没有默认选中</span>
      </div></div>`}
  </div>`;
}
function taskCardHtml(t, inModal){
  const chips = `${statusChip(t.viewStatus, t.parkedDeadline)} ${riskBadge(t.riskLevel)}`;
  const proj = projById(t.projectRef);
  const isHopper = t.route==='hopper';
  const budget = isHopper
    ? `Hopper 执行域 · 熔断 ¥${t.budget.maxCost} · 已花 ${t.spent.known?'¥'+t.spent.value:'还没有确切数字'}`
    : `已跑 ${t.elapsedMin} 分钟 / 上限 ${t.budget.walltimeActiveMin} 分钟 · 已花 ${t.spent.known?'¥'+t.spent.value:'还没有确切数字'} / 熔断 ¥${t.budget.maxCost}`;
  let actions = '';
  const vs = t.viewStatus;
  if(isHopper) actions = `<span class="xs muted">执行状态归 Hopper 账本，这里只投影 · 细节在「记录」与 Hopper Console（工程排障面） <span class="stage-tag">P0.5</span></span>`;
  else if(vs==='ready_for_review') actions = `<button class="btn btn-primary" data-go="#/review/${t.id}">${icon('flag',13)} 去验收</button>`;
  else if(vs==='blocked'){
    const ans = state.blockedAnswer[t.id];
    actions = ans
      ? `<span class="xs ac-pass">${icon('check',12)} 已把你的回答送过去，继续跑</span>`
      : `<span style="display:flex;gap:var(--space-2);flex:1"><input id="ans-${t.id}" placeholder='直接回答，比如「按商业受众写」' style="flex:1;padding:7px 10px;border:1px solid var(--glass-border);border-radius:var(--radius-sm);background:var(--control-glass)">
        <button class="btn btn-ink-outline" data-answer="${t.id}">回答</button></span>`;
  }
  else if(vs==='paused_step_boundary'){
    actions = state.stepConfirmed[t.id]
      ? `<span class="xs ac-pass">${icon('check',12)} 已确认，继续走第 4 步</span>`
      : `<button class="btn btn-primary" data-stepok="${t.id}">${icon('check',13)} 这一步行，继续</button>
         <button class="btn" data-stepno="${t.id}">这步不对，说两句</button>`;
  }
  else if(vs==='waiting_confirmation'){
    actions = state.billingCut
      ? `<span class="xs ac-pass">${icon('check',12)} 已切到 API 计费（月预算内），继续跑</span>`
      : `<button class="btn btn-primary" data-billing="1">${icon('check',13)} 拍板：切到 API 计费</button>
         <button class="btn" data-billing="0">不切，停在这</button>`;
  }
  else if(vs==='review_approved_waiting_merge'){
    actions = `<button class="btn-s3" data-s3="${t.id}">${icon('fingerprint',15)} 用 Touch ID 批准合并</button>
      <span class="xs faint">S3 不可逆 · 仅这台电脑</span>`;
  }
  else if(vs==='failed'){
    actions = state.retried[t.id]
      ? `<span class="xs ac-pass">${icon('check',12)} 已重派，重过全部门禁</span>`
      : `<button class="btn btn-ink-outline" data-retry="${t.id}">${icon('history',13)} 重派（重过门禁）</button>
         <button class="btn" data-gofocus="${t.focusId}">聊聊怎么修</button>`;
  }
  else if(vs==='merge_failed'){
    actions = `<button class="btn btn-ink-outline" data-mconflict="${t.id}">看冲突</button>
      <button class="btn" data-retry="${t.id}">我手改了，重新合并</button>`;
  }
  else if(vs==='running') actions = `<span class="xs muted">跑到步边界或出事我会叫你</span>`;
  else if(vs==='merging') actions = `<span class="xs muted">合并进行中，不用你</span>`;
  else if(vs==='task_done') actions = `<span class="xs muted">已交付并合并 · <a data-goreview="${t.id}">回看证据</a></span>`;
  else if(vs==='superseded') actions = `<span class="xs muted">被 v2 替代，账还留着</span>`;
  else if(vs==='cancel_settled') actions = `<span class="xs muted">你叫停的，这轮作废 · 可以同卡重开</span>`;
  else if(vs==='queued'||vs==='confirmed') actions = `<span class="xs muted">排在队列里，到点我开工</span>`;
  else if(vs==='parked') actions = `<span class="xs muted">停靠等你，${t.parkedDeadline.slice(5,10)} 前不回我就按老口径继续</span>
    <button class="btn btn-ink-outline" data-gofocus="${t.focusId}">去回答</button>`;
  return `<div class="card-item" id="tl-task-${t.id}" data-task="${t.id}">
    <div style="display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap">
      ${icon('zap',14)}<strong>${esc(t.title)}</strong>${chips}
      <span class="tag mono">${isHopper?'HP':'T1'}</span>
      ${proj?`<span class="proj-badge">${icon('folder',10)} ${esc(proj.title)}</span>`:''}
      <span class="xs faint mono">第 ${t.attempt} 次尝试</span>
    </div>
    <div class="small muted" style="margin-top:6px">${esc(t.lastEvent)}</div>
    <div class="xs faint mono" style="margin-top:4px">${budget}</div>
    <div style="display:flex;gap:var(--space-2);margin-top:var(--space-3);align-items:center;flex-wrap:wrap">${actions}</div>
    ${inModal?`<div style="margin-top:var(--space-3)"><button class="btn" data-gofocus="${t.focusId}">${icon('layers',13)} 打开所属 Focus</button></div>`:''}
  </div>`;
}

/* ---------- 右栏实体列表 ---------- */
function railItemObligation(o){
  const isHuman = o.owner==='human';
  const statusTag = o.status==='waiting' ? `<span class="sub">等 ${esc(o.waitingOn||'外部')} · ${esc(o.dueOrTrigger||'')}</span>`
    : o.status==='deferred' ? `<span class="sub">已推迟：${esc(o.deferReason||'')}</span>`
    : o.status==='resolved' ? `<span class="sub">已了结</span>` : '';
  return `<button class="rail-item" data-ob="${o.id}">
    ${icon(isHuman?'user':o.owner==='agent'?'zap':'external',12)}
    <span class="t">${esc(o.title)}
      <span class="sub">${isHuman&&o.needs?NEEDS_LABEL[o.needs]+' · ':''}${OB_STATUS_LABEL[o.status]}</span>
      ${statusTag}
    </span>
  </button>`;
}
function railItemTask(t){
  const extra = t.attempt>1 ? `第 ${t.attempt} 次尝试` : (t.route==='hopper'?'Hopper 执行域':'');
  return `<button class="rail-item" data-rail-task="${t.id}">
    ${icon('zap',12)}
    <span class="t">${esc(t.title)}${extra?`<span class="sub">${extra}</span>`:''}</span>
    ${statusChip(t.viewStatus, t.parkedDeadline)}
  </button>`;
}
function artStatusBadge(a){
  if(a.superseded) return `<span class="art-status art-superseded">已被替代</span>`;
  if(a.role==='deliverable') return `<span class="art-status art-deliverable">已产出</span>`;
  if(a.role==='expected'){
    const isInputMissing = a.obRef && obById(a.obRef) && obById(a.obRef).owner==='human';
    return `<span class="art-status art-expected">${isInputMissing?'缺料，等你':'待产出'}</span>`;
  }
  return `<span class="art-status art-reference">参考</span>`;
}
function railExpectHtml(f){
  const exp = EXPECTATIONS[f.id]; if(!exp) return '';
  const riskCount = exp.acceptance.filter(a=>a.state==='at_risk').length;
  const artPct = Math.round(exp.artifacts.delivered/exp.artifacts.expected*100);
  const budgetPct = Math.round(exp.budget.spent/exp.budget.max*100);
  return `<div class="card rail-sec" style="${riskCount?'border-color:var(--color-warning)':''}">
    <div class="h-rail">${icon('flag',13)} 期待 <span class="n">r${exp.revision}</span>
      ${riskCount?`<span class="chip st-warning">${icon('alert',11)} ${riskCount} 处偏差</span>`:`<span class="chip st-muted">对齐中</span>`}
    </div>
    <button class="rail-item" data-exp-edit="direction" data-fid="${f.id}">
      ${icon('arrowRight',12)}<span class="t">方向：${esc(exp.direction)}<span class="sub">点我可改 · 执行前自由改</span></span>
    </button>
    ${exp.acceptance.map((a,i)=>{
      const st = EXP_STATE[a.state];
      return `<button class="rail-item" data-exp-edit="acceptance" data-fid="${f.id}" data-idx="${i}">
        <span class="${st.cls}" style="flex:none;margin-top:2px">${icon(st.ic,12)}</span>
        <span class="t">${esc(a.text)}${a.note?`<span class="sub" style="color:var(--color-error)">${esc(a.note)}</span>`:''}</span>
      </button>`;
    }).join('')}
    <button class="rail-item" data-exp-edit="artifacts" data-fid="${f.id}">
      ${icon('pkg',12)}<span class="t">预期产物 ${exp.artifacts.delivered}/${exp.artifacts.expected} 已产出
        <span class="progress-track" style="margin-top:4px"><i style="width:${artPct}%"></i></span></span>
    </button>
    <button class="rail-item" data-exp-edit="budget" data-fid="${f.id}">
      ${icon('wallet',12)}<span class="t">预算 ¥${exp.budget.spent} / 熔断 ¥${exp.budget.max}
        <span class="progress-track" style="margin-top:4px"><i style="width:${budgetPct}%;background:${budgetPct>=80?'var(--color-warning)':'var(--active-ink)'}"></i></span></span>
    </button>
  </div>`;
}
function railHtml(f){
  const obsAll = DB.obligations.filter(o=>o.focusId===f.id);
  const human = obsAll.filter(o=>o.owner==='human' && ['open','blocked'].includes(o.status));
  const agent = obsAll.filter(o=>o.owner==='agent' && ['open','in_progress'].includes(o.status));
  const external = obsAll.filter(o=>o.owner==='external' && ['waiting','deferred'].includes(o.status));
  const agentWaiting = obsAll.filter(o=>o.owner==='agent' && o.status==='waiting');
  const doneObs = obsAll.filter(o=>['resolved','superseded'].includes(o.status));
  const myTasks = DB.tasks.filter(t=>t.focusId===f.id && ['running','queued','confirmed','paused_step_boundary','waiting_confirmation','merging'].includes(t.viewStatus));
  const arts = DB.artifacts.filter(a=>a.focusId===f.id);
  const mems = DB.memory.filter(x=>x.focusId===f.id && x.trust!=='candidate').slice(0,3);
  const projects = (f.projectRefs||[]).map(projById).filter(Boolean);
  const sec = (title, ic, n, body)=>`<div class="card rail-sec"><div class="h-rail">${icon(ic,13)} ${title} <span class="n">${n}</span></div>${body}</div>`;
  return `<div class="rail">
    <div class="xs faint" style="padding:0 6px">点条目，左侧对话会跳到生成它的那一条</div>
    ${railExpectHtml(f)}
    ${sec('安排', 'layers', human.length+agent.length+external.length+agentWaiting.length,
      (human.length?`<div class="rail-group" style="color:var(--color-warning)">${icon('flag',11)} 需要你</div>`+human.map(railItemObligation).join(''):'')+
      (myTasks.length||agent.length?`<div class="rail-group" style="color:var(--color-success)">${icon('loader',11)} 我在做</div>`+myTasks.map(railItemTask).join('')+agent.map(railItemObligation).join(''):'')+
      (external.length||agentWaiting.length?`<div class="rail-group">${icon('hourglass',11)} 等外部 / 待命</div>`+external.map(railItemObligation).join('')+agentWaiting.map(railItemObligation).join(''):'')+
      (doneObs.length?`<div class="rail-group faint">已了结 ${doneObs.length} 件</div>`:'')+
      (!human.length&&!agent.length&&!external.length&&!agentWaiting.length&&!myTasks.length?'<div class="empty" style="padding:12px">没有未结的安排</div>':''))}
    ${sec('产物', 'pkg', arts.length,
      arts.map(a=>{
        const proj = projById(a.projectRef);
        return `<button class="rail-item" data-art="${a.id}">
          ${icon('file',12)}
          <span class="t">${esc(a.title)}
            <span class="sub">${a.role==='expected'?'expected':`v${a.version}`}${a.taskRef?' · 由任务产出':''}${proj?` · ${esc(proj.title)}`:''}</span>
          </span>
          ${artStatusBadge(a)}
        </button>`;
      }).join('') + `<div style="padding:4px 8px"><button class="btn" data-expect-art="${f.id}">${icon('plus',12)} 我期待一个 X</button></div>` || '<div class="empty" style="padding:12px">还没有产物</div>')}
    ${projects.length?sec('涉及项目', 'folder', projects.length,
      projects.map(p=>`<button class="rail-item" data-proj="${p.id}">${icon('folder',12)}<span class="t">${esc(p.title)}<span class="sub mono">${esc(p.path)}</span></span></button>`).join('')+
      '<div class="xs faint" style="padding:4px 8px">Focus 可跨项目；也可以不属于任何项目</div>'):''}
    ${mems.length?sec('记住的事', 'book', mems.length,
      mems.map(x=>`<div class="rail-item" style="cursor:default"><span class="trust-badge trust-${x.trust}" style="margin-top:2px">${{user_stated:'你说过',user_approved:'你确认过',auto_low_impact:'自动'}[x.trust]}</span><span class="t">${esc(x.text)}</span></div>`).join('')+
      `<div style="padding:4px 8px"><a data-go="#/memory" class="xs">全部记忆 →</a></div>`):''}
  </div>`;
}
function composerFor(f){
  if(f.learning){
    return `<div class="composer" style="display:flex;gap:var(--space-3);align-items:center">
      <span class="dot breathing" style="background:var(--active-ink)"></span>
      <span class="muted small">学习中，学完就能说了…（阻塞式奠基：不懂装懂比让你等更糟）</span>
    </div>`;
  }
  if(['closed','abandoned','archived'].includes(f.lifecycle)){
    const copy = {
      closed:['已收官','正常走完的。要继续，只能以它为底 fork 一件新的。'],
      abandoned:['已放弃','你主动中止的——放弃也是干净的收场，不是失败。想重来，fork 一件新的。'],
      archived:['已归档','封存不删，随时可以在「记录」里重开。']
    }[f.lifecycle];
    return `<div class="composer" style="display:flex;gap:var(--space-3);align-items:center">
      <span class="muted small">${copy[0]} · ${copy[1]}停机状态：不进「今天」、拒绝新写入。</span>
      <span class="topbar-spacer"></span>
      <button class="btn btn-primary" data-fork="${f.id}">${icon('plus',13)} fork 一件新的</button>
    </div>`;
  }
  return composerHtml();
}
function renderFocus(focusId){
  const f = focusById(focusId) || DB.focuses[0];
  const tl = TIMELINES[f.id] || [];
  const ob = openByOwner(f.id);
  const lifecycleLabel = {active:'进行中',captured:'刚记下',dormant:'休眠中',closed:'已收官',abandoned:'已放弃',archived:'已归档'}[f.lifecycle];
  const convo = `<div class="convo-col">
    <div class="statecard card">
      <div style="flex:1;min-width:0">
        <div style="display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap">
          <strong>${esc(f.title)}</strong>
          <span class="tag" style="${f.lifecycle==='closed'?'color:var(--color-success);border-color:var(--color-success)':''}">${lifecycleLabel}</span>
          <span class="tag mono">r${f.currentRevision}</span>
        </div>
        <div class="small muted" style="margin-top:2px">${esc(f.direction)}</div>
      </div>
      <div class="xs" style="flex:none;text-align:right">
        ${ob.human?`<div style="color:var(--color-warning)">你 ${ob.human} 件</div>`:''}
        ${ob.agent?`<div style="color:var(--color-success)">我 ${ob.agent} 件</div>`:''}
        ${ob.external?`<div class="muted">等外部 ${ob.external} 件</div>`:''}
        ${!ob.human&&!ob.agent&&!ob.external?'<div class="muted">没有未结的事</div>':''}
      </div>
      <button class="btn" data-goto-records="${f.id}" title="工程航迹、事件流与版本记录">${icon('history',13)} 记录</button>
    </div>
    <div class="timeline">
      ${f.learning?`<div class="card-item" style="border-color:var(--active-ink-border)">
        <div style="display:flex;gap:var(--space-2);align-items:center"><span class="dot breathing" style="background:var(--active-ink)"></span><strong>学习中</strong><span class="tag">learning · 一等会话状态</span></div>
        <div class="small" style="margin-top:6px">我在读这件事相关的材料和你之前说过的话，大概还要一两分钟。学完我会告诉你学了什么、还缺什么，然后再开聊。（演示里缩短了）</div>
      </div>`:''}
      ${tl.map(item=>{
        if(item.kind==='note') return `<div class="tl-note">${esc(item.text)}</div>`;
        if(item.kind==='turn') return turnHtml(item);
        if(item.kind==='confirm') return confirmCardHtml(item.receiptId);
        if(item.kind==='entity') return entityHtml(item);
        if(item.kind==='pkg') return pkgHtml();
        if(item.kind==='progress') return progressHtml();
        if(item.kind==='standby') return standbyHtml();
        if(item.kind==='drift') return driftHtml();
        if(item.kind==='interview') return interviewHtml();
        if(item.kind==='task') return taskCardHtml(taskById(item.taskId));
        return '';
      }).join('')}
      <div id="live-turns">${(state.liveTurns[f.id]||[]).map(turnHtml).join('')}</div>
      ${state.playing && state.playing.key===f.id ? `<div class="card-item" style="display:flex;gap:var(--space-2);align-items:center;border-color:var(--active-ink-border)">
        ${icon('loader',14,'breathing')}<span class="small">播报中（TTS）· 前半句已送达</span>
        <span class="topbar-spacer"></span>
        <button class="btn" data-barge="1">打断（barge-in）</button>
      </div>`:''}
    </div>
    ${composerFor(f)}
  </div>`;
  return `<div class="page"><div class="focus-layout">${convo}${railHtml(f)}</div></div>`;
}
function renderChatNew(){
  return `<div class="page page-narrow">
    <div class="statecard card">
      <div style="flex:1"><strong>新对话</strong>
        <div class="small muted">想到哪说到哪。聊成熟了，我会问你要不要把这件事立起来持续关注——主路径是开口聊（开口即建草稿）；侧栏 + 号是快速立卡的旁路，不是必经。</div>
      </div>
    </div>
    <div class="timeline"><div class="tl-note">还没有锚定到任何事</div><div id="live-turns">${(state.liveTurns['chat-new']||[]).map(turnHtml).join('')}</div></div>
    ${composerHtml()}
  </div>`;
}
function composerHtml(){
  const c = state.composer;
  if(c.mode==='recording'){
    return `<div class="composer"><div class="composer-row">
      <button class="mic-btn recording" data-comp="cancel" title="取消">${icon('x',18)}</button>
      <div class="level-bars">${[0,1,2,3,4].map(i=>`<span style="animation-delay:${i*0.12}s"></span>`).join('')}</div>
      <span class="mono small" style="color:var(--color-error)">${String(Math.floor(c.recSec/60)).padStart(2,'0')}:${String(c.recSec%60).padStart(2,'0')}</span>
      <span class="topbar-spacer"></span>
      <button class="btn" data-comp="totext">${icon('keyboard',13)} 转文字改一改</button>
      <button class="btn btn-primary" data-comp="send">${icon('send',13)} 发送</button>
    </div><div class="composer-hint"><span>松开空格也会结束这一小段</span><span>Esc 取消，彻底丢弃</span></div></div>`;
  }
  if(c.mode==='transcribing'){
    return `<div class="composer"><div class="composer-row">
      <span class="thinking" style="padding:8px 4px"><span class="dots"><span></span><span></span><span></span></span>转写中…</span>
    </div><div class="composer-hint"><span>转写完成后只进输入框，这里的内容我还看不到</span></div></div>`;
  }
  if(c.mode==='confirm'){
    return `<div class="composer"><div class="composer-row">
      ${icon('keyboard',15)}
      <input id="composer-edit" value="右栏可以，产物那组我希望「缺料」的排到最上面" autofocus>
      <button class="btn" data-comp="cancel">取消</button>
      <button class="btn btn-primary" data-comp="sendtext">${icon('send',13)} 发送</button>
    </div><div class="composer-hint"><span>这里的内容我还看不到，发送才算数</span></div></div>`;
  }
  return `<div class="composer"><div class="composer-row">
    <button class="mic-btn" data-comp="rec" title="按住空格也可以说话">${icon('mic',18)}</button>
    <input id="composer-input" placeholder="打字也行，想到哪说到哪…">
    <button class="btn btn-primary" data-comp="sendtext">${icon('send',13)}</button>
  </div><div class="composer-hint"><span>点击说话 / 按住空格</span><span>切到免手模式 <span class="stage-tag">P0.5</span></span></div></div>`;
}
</script>

<script>
/* ---------- 验收面 ---------- */
function acIcon(s){ return s==='pass'?icon('check',13,'ac-pass'):s==='fail'?icon('x',13,'ac-fail'):icon('clock',13,'ac-unknown'); }
function renderReview(taskId){
  const t = taskById(taskId); const rv = REVIEWS[taskId];
  if(!t || !rv) return `<div class="page"><div class="empty">这个任务的验收证据视图在演示数据里没有展开（完整证据见「月度跑批脚本」「讲稿正文初稿」「样式实现首版」三个任务）</div></div>`;
  const f = focusById(t.focusId);
  const sel = state.reviewSel[taskId] ?? 0;
  const verdicts = state.acVerdicts[taskId] || {};
  const effStatus = (ac,i)=> rv.writing && ac.source==='manual' ? (verdicts[i]||'unknown') : ac.status;
  const allManualJudged = !rv.writing || rv.acs.every((ac,i)=> ac.source!=='manual' || verdicts[i]);
  const ac = rv.acs[sel];
  const articleSec = (rv.writing && ac.source==='manual') ? (ART_CONTENT.art_talk_draft.sections[sel] || null) : null;
  const acBody = articleSec
    ? `<div class="article-view"><div class="h-sec" style="font-size:var(--text-sm);margin-bottom:6px">${esc(articleSec.name)}</div>${esc(articleSec.body).replace(/\n/g,'<br>')}</div>`
    : ac.evidence
    ? (ac.evidence.kind==='diff' ? `<div class="diff">${ac.evidence.body}</div>`
      : ac.evidence.kind==='log' ? `<div class="diff">${esc(ac.evidence.body)}</div>`
      : `<div class="card-pad card small">${esc(ac.evidence.body)}</div>`)
    : `<div class="card card-pad small muted">${rv.writing&&ac.source==='manual'?'这条只能人工判断。读完后在下面给结论。':'没有绑上证据，诚实标注为 unknown，不显示伪精确。'}</div>`;
  return `<div class="page">
    <button class="btn" data-go="#/focus/${t.focusId}" style="margin-bottom:var(--space-3)">${icon('chevronRight',13)} 回到「${esc(f.title)}」</button>
    <div class="card card-pad">
      <div style="display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap">
        <span class="h-page" style="font-size:var(--text-lg)">${esc(t.title)}</span>
        ${statusChip(t.viewStatus)} ${riskBadge(t.riskLevel)} <span class="tag mono">T1</span>
      </div>
      <div class="small" style="margin-top:6px">执行和检查都跑完了，<strong>等你验收</strong>。下面按验收标准逐条看。</div>
      <div class="appr-context" style="margin-top:8px">
        <span>所属：${esc(f.title)}</span><span class="mono">决策包 ${rv.packageRef.id.slice(0,12)}… r${rv.packageRef.revision}</span>
        <span class="mono">已跑 ${t.elapsedMin} 分钟 · 已花 ${t.spent.known?'¥'+t.spent.value:'还没有确切数字'} / 熔断 ¥${t.budget.maxCost}</span>
        <span class="mono">第 ${t.attempt} 次尝试</span>
      </div>
      <div style="display:flex;gap:var(--space-2);margin-top:var(--space-3);align-items:center">
        <span class="xs faint">讲给我听：</span>
        ${[['one_liner','一句话'],['walkthrough','带我过一遍'],['decisions','关键判断']].map(([lv,lb])=>`<button class="btn ${state.explainLevel&&state.explainLevel[t.id]===lv?'btn-ink-outline':''}" data-explain="${lv}">${lb}</button>`).join('')}
      </div>
      ${state.explainLevel&&state.explainLevel[t.id]?`<div style="background:var(--active-ink-wash);border:1px solid var(--active-ink-border);border-radius:var(--radius-sm);padding:10px 14px;margin-top:var(--space-3);font-size:var(--text-sm)">${esc((EXPLAIN[t.id]||{})[state.explainLevel[t.id]]||'')}</div>`:''}
    </div>
    <div class="review-grid">
      <section>
        <div class="h-sec" style="margin-bottom:var(--space-3)">验收标准 ${rv.writing?'<span class="xs faint">（人工项须逐条给结论）</span>':''}</div>
        ${rv.acs.map((a,i)=>{
          const st = effStatus(a,i);
          const ic = (st==='pass' && a.source==='agent_claim') ? `<span class="ac-hollow">${icon('check',10)}</span>` : acIcon(st);
          return `<button class="ac-item ${i===sel?'active':''}" data-ac="${i}">
            ${ic}
            <span style="flex:1">${esc(a.criterion)}</span>
            <span class="tag">${{verify:'机器验',agent_claim:'自报',manual:'人工'}[a.source]}</span>
          </button>`;
        }).join('')}
        <div class="card card-pad" style="margin-top:var(--space-3)">
          <div class="h-sec" style="margin-bottom:var(--space-2)">尝试记录</div>
          ${rv.runs.map(r=>`<div class="xs muted" style="margin-bottom:4px"><span class="mono">#${r.attempt}</span> ${esc(r.result)}</div>`).join('')}
        </div>
      </section>
      <section>
        <div class="card card-pad">
          <div class="h-sec" style="margin-bottom:var(--space-2)">证据 · ${esc(ac.section||'第 '+(sel+1)+' 条')}</div>
          ${ac.source==='agent_claim'?`<div class="xs" style="color:var(--color-warning);margin-bottom:var(--space-2)">自报证据：强度低于机器验，空心勾以示降权，你可以推翻。</div>`:''}
          ${acBody}
          ${rv.writing && ac.source==='manual' ? `
            <div style="display:flex;gap:var(--space-2);margin-top:var(--space-3)">
              <button class="btn ${verdicts[sel]==='pass'?'btn-primary':''}" data-verdict="pass" data-task="${taskId}">${icon('check',12)} 这条行</button>
              <button class="btn ${verdicts[sel]==='fail'?'btn-danger-outline':''}" data-verdict="fail" data-task="${taskId}">${icon('x',12)} 这条不行</button>
            </div>`:''}
        </div>
        <div class="card card-pad" style="margin-top:var(--space-4)">
          <div class="h-sec" style="margin-bottom:var(--space-2)">这次执行里的判断（你都可以推翻）</div>
          ${rv.decisions.map(d=>`<div class="decision-row">
            <div style="flex:1"><div>${esc(d.what)}</div><div class="xs muted">原因：${esc(d.why)}</div></div>
            <button class="btn" data-overrule>推翻</button>
          </div>`).join('')}
        </div>
        <div class="card card-pad" style="margin-top:var(--space-4)">
          <div class="h-sec" style="margin-bottom:var(--space-3)">你的裁决</div>
          <div style="display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center">
            ${rv.s3
              ? `<button class="btn-s3" data-s3="${taskId}">${icon('fingerprint',15)} 用 Touch ID 批准并合并</button>
                 <span class="xs faint">S3 不可逆 · 只能在这台电脑上完成，语音与远程永不出现此按钮</span>`
              : `<button class="btn btn-primary" id="btn-approve" ${allManualJudged?'':'disabled'}>${icon('check',13)} 通过${allManualJudged?'':'（先逐条裁决人工项）'}</button>`}
            <button class="btn" id="btn-rework">返工，附带意见</button>
            <button class="btn btn-danger-outline" id="btn-reject">这轮不行</button>
          </div>
          <div class="xs faint" style="margin-top:var(--space-3)">合并永远你拍板 · 「通过」只说验收，不说交付；合并后才叫「已交付」</div>
        </div>
      </section>
    </div>
  </div>`;
}

/* ---------- 辅助面 ---------- */
function renderMemory(){
  const trustLabel = {user_stated:'你说过',user_approved:'你确认过',auto_low_impact:'自动·低风险',candidate:'待你复核',third_party:'第三方'};
  const groups = [['M1','项目知识底座'],['M2','累积产物结论'],['M3','会话工作记忆']];
  return `<div class="page page-narrow">
    <div class="h-page" style="margin-bottom:6px">记忆库</div>
    <div class="muted small" style="margin-bottom:var(--space-4)">M0（你的档案）永不出现在这里；所有记忆都能追到来源。候选条目不会生效，等你复核。</div>
    ${groups.map(([tier,label])=>`
      <div class="card card-pad" style="margin-bottom:var(--space-4)">
        <div class="h-sec" style="margin-bottom:var(--space-2)"><span class="mono">${tier}</span> · ${label}</div>
        ${DB.memory.filter(x=>x.tier===tier).map(x=>`
          <div class="mem-row ${x.trust==='candidate'?'mem-candidate':''}" data-memopen="${x.id}" style="cursor:pointer">
            <span class="trust-badge trust-${x.trust}">${trustLabel[x.trust]}</span>
            <div style="flex:1"><div>${esc(x.text)}</div>
              <div class="xs faint">来源 ${x.source} · ${esc((focusById(x.focusId)||{}).title||'全局')} · 点我看来源与核验</div></div>
            ${x.trust==='candidate'?`<span class="mem-actions"><button class="btn btn-primary" data-mem="ok" data-id="${x.id}">记下</button><button class="btn" data-mem="no" data-id="${x.id}">不记</button></span>`:''}
          </div>`).join('') || '<div class="empty">暂无</div>'}
      </div>`).join('')}
  </div>`;
}
function renderArtifacts(){
  return `<div class="page page-narrow">
    <div class="h-page" style="margin-bottom:6px">产物库</div>
    <div class="muted small" style="margin-bottom:var(--space-4)">所有 Focus 的产物时间线；点行进详情（diff / 导出 / 标记已产出）。</div>
    <div class="card card-pad">
      <table class="data">
        <tr><th>产物</th><th>状态</th><th>所属 Focus / 项目</th><th>digest</th><th>时间</th></tr>
        ${DB.artifacts.map(a=>{
          const f = focusById(a.focusId); const p = projById(a.projectRef);
          return `<tr data-art="${a.id}">
            <td>${icon('file',12)} ${esc(a.title)}</td>
            <td>${artStatusBadge(a)}</td>
            <td class="small">${esc(f?f.title:'')}${p?` <span class="proj-badge">${esc(p.title)}</span>`:''}</td>
            <td class="mono faint">${esc(a.digest||'—')}</td>
            <td class="mono faint">${fmtTime(a.createdAt)}</td></tr>`;
        }).join('')}
      </table>
    </div>
  </div>`;
}
function renderCost(){
  const b = DB.costs.monthBudget; const pct = Math.round(b.used/b.CNY*100);
  const barColor = pct>=100?'var(--color-error)':pct>=80?'var(--color-warning)':'var(--active-ink)';
  return `<div class="page page-narrow">
    <div class="h-page" style="margin-bottom:var(--space-4)">成本</div>
    <div class="card card-pad" style="margin-bottom:var(--space-4)">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span class="h-sec">本月 API 预算</span>
        <span class="mono">¥${b.used} / ¥${b.CNY} · ${pct}%</span>
      </div>
      <div class="budget-bar"><i style="width:${pct}%;background:${barColor}"></i></div>
      <div class="xs faint" style="margin-top:6px">只统计真实 API 花销；订阅额度不计入。80% 提醒，100% 熔断。</div>
    </div>
    ${DB.costs.byProject.map(p=>`
      <div class="card card-pad" style="margin-bottom:var(--space-3)">
        <div class="h-sec" style="margin-bottom:6px">${esc(p.title)}</div>
        <div class="small">
          ${Object.entries(p.known).map(([c,v])=>`<span class="mono">${c==='CNY'?'¥':'$'}${v}</span>`).join(' · ')}
          ${p.unknownCount?` · 还有 ${p.unknownCount} 笔<span style="color:var(--color-warning)">还没有确切数字</span>`:''}
        </div>
        <div class="xs faint">订阅额度内（已用 ${p.subscriptionCalls} 次），不折算金额</div>
      </div>`).join('')}
  </div>`;
}
function renderSettings(){
  return `<div class="page page-narrow">
    <div class="h-page" style="margin-bottom:var(--space-4)">设置</div>
    <div class="card card-pad" style="margin-bottom:var(--space-4)">
      <div class="h-sec" style="margin-bottom:var(--space-2)">空间管理</div>
      <div class="xs faint" style="margin-bottom:var(--space-3)">空间 = 若干 Focus 共享的关系与边界；删除空间不删除里面的 Focus。</div>
      ${DB.spaces.map(sp=>{
        const n = DB.focuses.filter(f=>f.spaceId===sp.id).length;
        return `<div class="mem-row">
          ${icon('layers',13)}
          <div style="flex:1"><div>${esc(sp.title)}</div><div class="xs faint">${n} 件持续的事</div></div>
          <button class="btn" data-space-rename="${sp.id}">重命名</button>
          <button class="btn btn-danger-outline" data-space-del="${sp.id}">删除</button>
        </div>`;
      }).join('')}
      <div class="modal-row"><button class="btn btn-ink-outline" data-space-new="1">${icon('plus',12)} 新空间</button></div>
    </div>
    <div class="card card-pad" style="margin-bottom:var(--space-4)">
      <div class="h-sec" style="margin-bottom:var(--space-2)">Gate 0 工程门禁</div>
      <div class="small" style="display:flex;gap:8px;align-items:center">${icon('check',13,'ac-pass')} 已关闭（身份/授权、幂等、独立验收、密钥隔离、审计链、删除传播 六类全开）</div>
      <div class="xs faint" style="margin-top:4px">Gate 0 未关时一律拒绝派发，没有 bypass 分支。</div>
    </div>
    <div class="card card-pad" style="margin-bottom:var(--space-4)">
      <div class="h-sec" style="margin-bottom:var(--space-2)">模型槽位</div>
      <table class="data">
        <tr><th>槽位</th><th>模型</th><th>用途</th></tr>
        <tr><td class="mono">brain</td><td class="mono">deepseek-v4-pro（reasoning 限额 1200）</td><td>对话与判断；reasoning 会吃掉 content 预算，max_tokens 下限 3000</td></tr>
        <tr><td class="mono">verify</td><td class="mono">gpt-5.6-sol</td><td>独立验收（异族评估器，同家族会警示并拦截）</td></tr>
        <tr><td class="mono">asr / tts</td><td class="mono">volc-sauc / volc-tts</td><td>语音链路</td></tr>
      </table>
      <div class="xs faint" style="margin-top:var(--space-2)">设置页读 /api/config 实时值，禁止硬编码（评审 U7）；密钥永不出接口。</div>
    </div>
    <div class="card card-pad" style="margin-bottom:var(--space-4)">
      <div class="h-sec" style="margin-bottom:var(--space-2)">免打扰与推送</div>
      <div class="small">22:00 – 08:00 不语音回叫，只落通知 · 邮件推送 <span class="stage-tag">P1</span> <span class="stage-tag">提案</span> · 电话升级 <span class="stage-tag">P1</span></div>
    </div>
    <div class="card card-pad" style="margin-bottom:var(--space-4)">
      <div class="h-sec" style="margin-bottom:var(--space-2)">上下文编译预算</div>
      <div class="small mono">M0 200 / M1 1200 / M2 800 / M3 800 tokens</div>
      <div class="xs faint" style="margin-top:4px">每轮确定性编译，不把全部历史塞进窗口；快照带 digest，选中与排除都可对账。</div>
    </div>
    <div class="card card-pad" style="margin-bottom:var(--space-4)">
      <div class="h-sec" style="margin-bottom:var(--space-2)">远程访问（tailnet 手机薄版）</div>
      <div class="small">只能看、不能重授权：审批落 push / paired_device_pin（≤S2）；edit 与 S3 一律回本机屏幕。</div>
      <div class="modal-row"><button class="btn btn-ink-outline" id="btn-tailnet">看看薄版长什么样</button></div>
    </div>
    <div class="card card-pad">
      <div class="h-sec" style="margin-bottom:var(--space-2)">数据与删除</div>
      <div class="small">forget_soft 可追溯；forget_hard 全库覆写（fts / projection / summary / backup / snapshot 五处同步），删除传播是 Gate 0 六类之一。</div>
      <div class="modal-row"><button class="btn btn-danger-outline" id="btn-forget">删除我的某项数据</button></div>
    </div>
  </div>`;
}
function renderRecords(focusId){
  const f = focusById(focusId);
  const canArchive = ['active','captured','dormant'].includes(f.lifecycle);
  const canReopen = f.lifecycle==='archived';
  const SEGMENTS = {
    foc_saydo:[{n:12, range:'昨天 15:02 – 17:40', turns:41, closed:true},{n:11, range:'周二 10:12 – 11:05', turns:23, closed:true},{n:10, range:'周一 21:40 – 22:03', turns:9, closed:false}],
    foc_report:[{n:5, range:'今天 09:31 – 10:12', turns:17, closed:true}],
    foc_talk:[{n:3, range:'三天前 14:00 – 15:22', turns:31, closed:true}],
    foc_trip:[{n:2, range:'两天前 20:10 – 20:45', turns:12, closed:true}]
  };
  const segs = SEGMENTS[f.id] || [];
  const deps = openObs(f.id).filter(o=>o.waitingOnObligationId);
  const laneDotline = (lane, i)=>{
    const dots = [4,3,2].slice(0, 2+i).map(()=>'<i class="dl-dot"></i>').join('<i class="dl-line"></i>');
    return `<span class="dl">${dots}<i class="dl-line"></i><i class="dl-dot cur"></i></span>`;
  };
  return `<div class="page page-narrow">
    <button class="btn" data-go="#/focus/${f.id}" style="margin-bottom:var(--space-3)">${icon('chevronRight',13)} 回到对话</button>
    <div style="display:flex;align-items:center;gap:var(--space-3);margin-bottom:6px;flex-wrap:wrap">
      <span class="h-page">记录 · ${esc(f.title)}</span>
      ${canArchive?`<button class="btn" data-farchive="${f.id}">归档（封存可重开）</button>`:''}
      ${canArchive?`<button class="btn" data-fabandon="${f.id}">放弃（主动中止）</button>`:''}
      ${canReopen?`<button class="btn btn-ink-outline" data-freopen="${f.id}">重开</button>`:''}
      ${f.lifecycle==='closed'?`<button class="btn btn-primary" data-fork="${f.id}">${icon('plus',13)} fork 一件新的</button>`:''}
    </div>
    <div class="muted small" style="margin-bottom:var(--space-4)">工程航迹、事件流与版本在这里。这是「记录」，不是你要天天看的地方。归档要填理由；closed 只能 fork 新 Focus。</div>
    <div class="card card-pad" style="margin-bottom:var(--space-4)">
      <div class="h-sec" style="margin-bottom:var(--space-2)">支线航迹（lanes × 事件序）<span class="stage-tag">P0.5</span></div>
      ${(f.lanes||[{id:'lan_main',title:'主线'}]).map((l,i)=>`
        <div style="display:flex;gap:var(--space-3);align-items:center;padding:7px 0;border-bottom:1px dashed var(--glass-border)">
          <span class="xs muted" style="width:96px;flex:none">${esc(l.title)}</span>
          ${laneDotline(l, i)}
          <span class="topbar-spacer"></span>
          <button class="btn" data-laneop="retire" data-lane="${l.id}">收起线</button>
          <button class="btn" data-laneop="redo" data-lane="${l.id}">从此步重走</button>
          <button class="btn" data-laneop="cont" data-lane="${l.id}">在此线续推</button>
        </div>`).join('')}
      <div class="xs faint" style="margin-top:var(--space-2)">圆点=事件，橙点=当前水位；线菜单横纵双向可用（含「整线重来」）。</div>
    </div>
    <div class="card card-pad" style="margin-bottom:var(--space-4)">
      <div class="h-sec" style="margin-bottom:var(--space-2)">依赖链（一件事醒了，另一件才醒）</div>
      ${deps.length ? deps.map(o=>{
        const pre = obById(o.waitingOnObligationId);
        return `<div class="mem-row"><span class="small" style="flex:1">「${esc(o.title)}」等「${esc(pre?pre.title:'?')}」</span>
          <button class="btn" data-dep-undo="${o.id}">解除依赖</button></div>`;
      }).join('') : `<div class="xs faint">暂无依赖。dependency_set / woken / blocked 事件落账，无环校验。</div>`}
    </div>
    <div class="card card-pad" style="margin-bottom:var(--space-4)">
      <div class="h-sec" style="margin-bottom:var(--space-2)">会话段（历史=段+展开，当前会话=逐轮）</div>
      ${segs.length ? segs.map(s=>`
        <div class="mem-row">
          <div style="flex:1"><div>第 ${s.n} 次会话 · ${esc(s.range)}</div>
            <div class="xs faint">${s.turns} 轮 · ${s.closed?'已收场':'中断（无 closed 事件，截至最后事件时间）'}</div></div>
          <button class="btn" data-seg="${f.id}:${s.n}">${state.segOpen===f.id+':'+s.n?'收起':'展开转写'}</button>
        </div>`).join('') : '<div class="xs faint">还没有会话段。</div>'}
      ${state.segOpen && state.segOpen.startsWith(f.id+':') ? `<div class="article-view" style="margin-top:var(--space-3)">（懒加载转写节选）<br>你：demo 先给我看，确认了再动 console。<br>SayDo：好，那核心动作其实只有三个……<br><span class="xs faint">转写按 activation 校验归属读取，不暴露路径；store_transcript=false 的段显示「未存转写，仅事件留痕」</span></div>`:''}
    </div>
    <div class="card card-pad" style="margin-bottom:var(--space-4)">
      <div class="h-sec" style="margin-bottom:var(--space-2)">事件流（FocusEvent，append-only）</div>

function locateTimeline(id){
  const el = document.getElementById(id);
  if(!el) return false;

let replyIdx = 0;
function convoKey(){
  if(currentRoute.startsWith('#/focus/')) return currentRoute.split('/')[2];
  if(currentRoute==='#/chat-new') return 'chat-new';
  return null;
}
function simulateReply(key){
  setTimeout(()=>{
    (state.liveTurns[key] = state.liveTurns[key] || []).push({speaker:'ai', ts:new Date().toISOString(), heard:true, text:AI_REPLIES[replyIdx++ % AI_REPLIES.length]});
    if(convoKey()===key){ rerenderMain(); scrollConvo(); }
    /* S5：播报实时态——AI 轮出现后进入 TTS 播报态，可演示 barge-in */
    state.playing = {key};
    if(convoKey()===key) rerenderMain();
    setTimeout(()=>{
      if(state.playing && state.playing.key===key){
        state.playing = null;
        if(convoKey()===key) rerenderMain();
      }
    }, 2600);
  }, 1400);
}
function pushUserTurn(text){
  const key = convoKey(); if(!key) return;
  (state.liveTurns[key] = state.liveTurns[key] || []).push({speaker:'user', ts:new Date().toISOString(), heard:true, text});
  rerenderMain(); scrollConvo();
  simulateReply(key);
}
function composerAction(act){
  const c = state.composer;
  if(act==='rec'){
    const key = convoKey();
    const f = key && key!=='chat-new' ? focusById(key) : null;
    if(f && (!f.projectRefs || f.projectRefs.length===0)){ openAnchorGuideModal(f); return; }
    c.mode='recording'; c.recSec=0;
    c.timer = setInterval(()=>{ c.recSec++; const t=$('.composer .mono'); if(t) t.textContent=`${String(Math.floor(c.recSec/60)).padStart(2,'0')}:${String(c.recSec%60).padStart(2,'0')}`; },1000);
    rerenderMain(); return; }
  if(act==='cancel'){ clearInterval(c.timer); c.mode='idle'; rerenderMain(); return; }
  if(act==='totext'){ clearInterval(c.timer); c.mode='transcribing'; rerenderMain();
    setTimeout(()=>{ state.composer.mode='confirm'; rerenderMain(); },1600); return; }
  if(act==='send'){ clearInterval(c.timer); c.mode='idle';
    pushUserTurn('右栏可以，产物那组我希望「缺料」的排到最上面。'); return; }
  if(act==='sendtext'){
    const inp = $('#composer-edit')||$('#composer-input');
    const text = inp && inp.value.trim() ? inp.value.trim() : '……';
    c.mode='idle'; pushUserTurn(text); return; }
}

}

let currentRoute = '#/today';
function rerenderMain(){ route(currentRoute, true); }
function route(hash, keepScroll){
  currentRoute = hash;
  const main = $('#main');
  const [path, arg] = [hash.split('/').slice(0,2).join('/'), hash.split('/')[2]];
  main.classList.toggle('main-locked', path==='#/focus');
  renderSidebar(hash);
  if(hash==='#/today' || hash==='#/' || hash==='') main.innerHTML = renderToday();
  else if(hash==='#/board') main.innerHTML = renderBoard();
  else if(path==='#/focus') main.innerHTML = renderFocus(arg);
  else if(hash==='#/chat-new') main.innerHTML = renderChatNew();
  else if(path==='#/review') main.innerHTML = renderReview(arg);
  else if(hash==='#/memory') main.innerHTML = renderMemory();
  else if(hash==='#/artifacts') main.innerHTML = renderArtifacts();
  else if(hash==='#/cost') main.innerHTML = renderCost();
  else if(hash==='#/settings') main.innerHTML = renderSettings();
  else if(path==='#/records') main.innerHTML = renderRecords(arg);
  else main.innerHTML = renderToday();
  if(!keepScroll) main.scrollTop = 0;
  wirePage();
}

/* 弹窗内交互 */
function wireModal(){
  const root = $('#modal-root');

      $('#appr-edit-area').innerHTML = `
        <div class="field" style="margin-top:var(--space-3)"><label>改成什么样再批（原命令逐字可改）</label>
        <textarea id="appr-cmd" rows="2">git push origin demo/redesign-2026-08-07</textarea></div>
        <div class="modal-row"><button class="btn btn-primary" data-appr-confirm="${rid}">按我改的签新收据</button></div>`;
      root.querySelectorAll('[data-appr-confirm]').forEach(b=> b.onclick = ()=>{
        state.approvalDone[rid] = '已按你改的命令签出新收据（superseded_by_edit，旧收据作废）';
        state.attnAck['appr:'+rid]=true;
        closeModal(); rerenderMain(); toast('已改后批准，新收据已签','pencil');
      });
      return;
    }
    const doneText = {accept:'已批准（收据待消费）', reject:'已拒绝（rejected）', ignore:'先挂起，到点我再提醒你'}[act];
    state.approvalDone[rid] = doneText;
    state.attnAck['appr:'+rid]=true;
    closeModal(); rerenderMain(); toast(doneText, act==='reject'?'x':'check');
  });
  root.querySelectorAll('[data-hp-yes],[data-hp-no]').forEach(el=> el.onclick = ()=>{
    const tid = el.dataset.hpYes || el.dataset.hpNo;
    state.blockedAnswer[tid] = el.dataset.hpYes !== undefined ? '可以发' : '不行，换写法';
    state.attnAck['task:'+tid]=true;
    closeModal(); rerenderMain(); toast('裁决已回传 Hopper（DecisionRequest resolved），任务继续','zap');
  });
  root.querySelectorAll('[data-anchor-daily]').forEach(el=> el.onclick = ()=>{
    const f = focusById(el.dataset.anchorDaily);
    let daily = DB.projects.find(p=>p.id==='prj_daily');
    if(!daily){ daily = {id:'prj_daily', title:'日常', kind:'local_folder', path:'~/SayDo/daily'}; DB.projects.push(daily); }

    closeModal(); rerenderMain(); toast('已挂到「日常」项目，可以开口了','mic');
  });
  root.querySelectorAll('[data-anchor-proj]').forEach(el=> el.onclick = ()=>{

    closeModal(); rerenderMain(); toast('已挂到「'+(projById(pid)||{}).title+'」，可以开口了','mic');
  });
  const exn = $('#exp-next'); if(exn) exn.onclick = ()=>{
    const p = DB.pkg;
    const budget = Number($('#exp-budget').value)||p.cost.max.value;
    const acs = [...document.querySelectorAll('[data-exp-ac]')].map(i=>i.value.trim()).filter(Boolean);
    const diff = [];
    if(budget!==p.cost.max.value) diff.push(`预算 ¥${p.cost.max.value} → ¥${budget}：第 3 步并入第 2 步，少一次截图复核`);
    if(acs.length!==p.acceptance.length) diff.push(`验收标准 ${p.acceptance.length} 条 → ${acs.length} 条`);
    if(!diff.length) diff.push('口径不变，只润色了措辞');
    openModal(`
      <div class="h-sec">我复述一遍影响，确认才生效</div>
      <ul class="pkg-list" style="margin-top:var(--space-3)">${diff.map(d=>`<li>${icon('arrowRight',12)}<span>${esc(d)}</span></li>`).join('')}</ul>
      <div class="xs faint" style="margin-top:var(--space-3)">确认后：包升为 r${p.revision+1}，revision 事件落账，历史不可篡改；我按新的做，不按旧的。改完没复述=没生效，防「你改了但我按旧的做」分叉。</div>
      <div class="modal-row"><button class="btn btn-primary" id="exp-commit">确认，按新期待来</button><button class="btn" data-close="1">再想想</button></div>`);
    const exCommit = $('#exp-commit'); if(exCommit) exCommit.onclick = ()=>{
      if(acs.length) p.acceptance = acs;

    state.retried[el.dataset.retry]=true; closeModal(); rerenderMain(); toast('已重派，重新过全部门禁');
  });
  root.querySelectorAll('[data-mconflict]').forEach(el=> el.onclick = ()=>openConflictModal(taskById(el.dataset.mconflict)));
  root.querySelectorAll('[data-goreview]').forEach(el=> el.onclick = ()=>{ closeModal(); location.hash = '#/review/'+el.dataset.goreview; });
}

/* 确认卡倒计时 */
setInterval(()=>{
  document.querySelectorAll('[data-countdown]').forEach(el=>{
    const rid = el.dataset.countdown;
    const r = DB.approvals.find(a=>a.id===rid);
    if(!r || state.confirmResolved[rid]) return;
    const left = Math.max(0, Math.round((new Date(r.presentedAt).getTime()+r.ttlMin*60000 - Date.now())/1000));
    const txt = `${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;
    el.textContent = txt; state.confirmLeft[rid] = txt;
    if(left===0){ state.confirmResolved[rid]='expired'; state.attnAck['conf:'+rid]=true; rerenderMain(); toast('超时未确认：这条不记（candidate 永不会自动生效，过期即丢不假装回流）','clock'); }
  });
}, 1000);

/* 全局 */
document.addEventListener('click', (e)=>{
  if(state.bellOpen && !e.target.closest('#bell-dd') && !e.target.closest('#btn-bell')){
    state.bellOpen=false; renderTopbar();
  }
});
document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape'){
    if($('#modal-ov')){ closeModal(); return; }
    if(state.composer.mode!=='idle'){ composerAction('cancel'); }
  }
  if(e.key==='Enter' && e.target && (e.target.id==='composer-input'||e.target.id==='composer-edit')){ composerAction('sendtext'); }
});
$('#toggle-notes').onclick = (e)=>{ e.preventDefault(); $('#design-notes').classList.toggle('open'); };
window.addEventListener('hashchange', ()=>route(location.hash||'#/today'));

if(new URLSearchParams(location.search).get('theme')==='dark'){ state.theme='dark'; document.documentElement.dataset.theme='dark'; }
renderDesignNotes();
renderTopbar();
route(location.hash || '#/today');
</script>
</body>
</html>
