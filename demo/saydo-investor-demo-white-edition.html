/* SAYDO / WHITE EDITION — a quieter, higher-contrast working canvas.
   Visual layer only. Task, approval, review and mock-execution semantics remain intact. */
:root {
  --bg:#fff;--surface:#fff;--soft:#f7f7f7;--side:#fbfbfb;
  --ink:#121212;--body:#515151;--muted:#787878;--line:#e7e7e7;
  --blue:#161616;--blue2:#393939;--tint:#f1f1f1;
  --green:#383838;--green-bg:#f5f5f5;--amber:#4b4b4b;--amber-bg:#f7f7f7;
  --red:#191919;--red-bg:#f3f3f3;--shadow:0 4px 22px rgba(0,0,0,.018);
  --radius:18px;--sidebar:222px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
}
body{background:var(--bg);font-size:14px;color:var(--ink);letter-spacing:-.015em;-webkit-font-smoothing:antialiased;}
::selection{background:#171717;color:#fff;}
button,input,textarea,select{font-family:var(--font);}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:4px;}
svg.icon{stroke-width:1.65;}
h1,h2,h3,h4{color:var(--ink);}
h1{letter-spacing:-.05em;font-weight:670;}
h2{letter-spacing:-.025em;font-weight:630;}
h3,h4{font-weight:620;}
p{line-height:1.85;}
.eyebrow{font-family:"SFMono-Regular",Consolas,monospace;font-size:10px;font-weight:450;letter-spacing:.12em;color:var(--muted);}
.card{border-color:var(--line);box-shadow:var(--shadow);border-radius:var(--radius);}
.pad{padding:26px;}
.stack{gap:20px;}.grid2{gap:18px;}
.subcard{background:var(--soft);border-radius:12px;border-color:var(--line);}
.btn{font-size:12px;font-weight:570;min-height:40px;padding:10px 16px;border-radius:10px;border-color:var(--line);transition:background .18s,box-shadow .18s,transform .18s,border-color .18s;}
.btn:hover:not(:disabled){background:var(--soft);border-color:#bcbcbc;box-shadow:0 3px 10px #00000006;transform:translateY(-1px);}
.btn.primary,.btn.success{background:var(--ink);color:var(--surface);border-color:var(--ink);box-shadow:0 3px 8px #0000000b;}
.btn.primary:hover:not(:disabled),.btn.success:hover:not(:disabled){background:#353535;border-color:#353535;color:#fff;box-shadow:0 6px 16px #00000013;}
.btn.soft{background:var(--soft);border-color:var(--line);color:var(--ink);}
.btn.danger{background:var(--surface);border-color:#bababa;color:var(--ink);}
.btn.ghost{background:transparent;border-color:transparent;}
.btn.lg{padding:13px 21px;min-height:48px;font-size:13px;border-radius:12px;}
.btn.sm{font-size:11px;min-height:32px;}
.btn:disabled{opacity:.34;box-shadow:none;}
.icon-btn{height:36px;width:36px;border-color:var(--line);border-radius:10px;color:var(--body);}
.icon-btn:hover{background:var(--soft);color:var(--ink);}
.text-link{font-size:12px;color:var(--ink);gap:7px;}
.text-link:hover{color:var(--body);}
.text-link .icon{transition:transform .16s;}
.text-link:hover .icon{transform:translateX(2px);}
.badge,.tag{border:1px solid var(--line);color:var(--body);background:var(--surface);font-size:10px;font-weight:500;border-radius:6px;}
.badge{padding:4px 8px;line-height:1.5;}
.badge.blue{color:var(--ink);background:var(--soft);border-color:#dedede;}
.badge.green{color:var(--ink);background:var(--soft);border-color:var(--line);}
.badge.amber{color:var(--ink);background:var(--surface);border-style:dashed;border-color:#aaa;}
.badge.red{background:var(--ink);color:var(--surface);border-color:var(--ink);}
.tag{padding:3px 7px;color:var(--muted);}
.avatar{background:var(--soft);color:var(--body);border:1px solid var(--line);font-weight:500;}
.brand-logo{background:var(--ink);color:var(--surface);border-radius:10px;box-shadow:none;letter-spacing:-1px;font-size:20px;}
.brand-logo.ai{background:var(--ink);color:var(--surface);box-shadow:none;border-radius:8px;}
.brand-glyph{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:square;stroke-linejoin:round;}
.project-icon,.project-icon.purple,.project-icon.teal{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:9px;}
.project-icon.purple{background:var(--soft);}.project-icon.teal{background:var(--soft);}
.sidebar{padding:29px 16px 16px;background:var(--side);border-color:var(--line);}
.brand{padding:0 10px 25px;gap:11px;}
.brand-name{font-size:25px;letter-spacing:-1.1px;line-height:1.2;font-weight:730;}
.brand-sub{font-size:8px;letter-spacing:.12em;font-family:Consolas,monospace;text-transform:uppercase;line-height:1.6;margin-top:5px;}
.side-search{background:var(--surface);font-size:11px;border-color:var(--line);border-radius:10px;padding:11px 10px;}
.side-search:hover{border-color:#bbb;}
.side-section{font-size:9px;letter-spacing:.09em;margin-top:27px;padding-bottom:10px;}
.side-section button .icon{width:14px;height:14px;}
.nav-item{font-size:12px;padding:11px 12px;border-radius:9px;gap:11px;color:var(--body);}
.nav-item:hover{background:#f0f0f0;}
.nav-item.active{background:#ececec;color:var(--ink);font-weight:630;}
.nav-item.active:before{width:2px;height:14px;left:0;background:var(--ink);}
.nav-count{background:var(--surface);color:var(--body);font-family:Consolas,monospace;font-size:10px;border-radius:4px;}
.nav-project{padding:10px;}
.nav-project strong{font-size:11px;font-weight:580;}.nav-project small{font-size:9px;}
.nav-project.selected{background:#f0f0f0;}
.side-note{font-family:var(--font);font-size:14px;letter-spacing:-.02em;font-style:normal;color:#878787;line-height:1.9;margin:14px 10px 22px;}
.side-bottom{border-color:var(--line);}.connection-small{color:var(--muted);font-size:9px;}
.connection-small .dot{width:5px;height:5px;background:var(--ink);}
.key{background:var(--soft);border-color:var(--line);color:var(--muted);}
.topbar{height:76px;padding:0 38px;background:rgba(255,255,255,.93);backdrop-filter:blur(18px);border-bottom-color:var(--line);}
.crumb{font-size:11px;color:var(--muted);letter-spacing:.01em;}
.crumb strong{color:var(--ink);font-weight:550;}
.crumb>span{color:#b8b8b8!important;}
.top-actions{gap:8px;}
.demo-chip{background:transparent;border:0;color:#707070;font-size:8px;font-family:Consolas,monospace;letter-spacing:.1em;padding:6px 8px;}
.demo-chip:before{content:"";display:inline-block;width:5px;height:5px;background:var(--ink);border-radius:50%;vertical-align:middle;margin-right:7px;}
.topbar .btn.primary{background:var(--surface);color:var(--ink);border-color:#cecece;box-shadow:none;}
.topbar .btn.primary:hover{background:var(--ink);color:var(--surface);}
.topbar .btn{font-size:11px;min-height:36px;}
.main{max-width:1600px;padding:34px 38px 36px;}
.page-heading{margin-bottom:27px;align-items:center;}
.page-heading h1{font-size:30px;letter-spacing:-.045em;font-weight:650;}
.page-heading p{font-size:12px;line-height:1.8;color:var(--muted);max-width:750px;}
.global-notice{background:var(--soft);color:var(--ink);border-bottom:1px dashed #aaa;font-size:12px;}
.view-footer{font-size:10px;margin-top:34px;padding-top:18px;line-height:1.8;color:var(--muted);}
.view-footer button{font-size:10px;}
/* Home / editorial hierarchy, not another grid of loud cards. */
.home-kicker{display:flex;justify-content:space-between;align-items:center;padding:0 0 20px;font-size:10px;font-family:Consolas,monospace;color:var(--muted);letter-spacing:.09em;}
.home-kicker .edition{display:inline-flex;align-items:center;gap:9px;letter-spacing:.07em;}
.home-kicker .edition:before{content:"";width:20px;height:1px;background:#b4b4b4;}
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.9fr);border:0;border-radius:0;background:var(--surface);min-height:340px;padding:20px 0 38px;margin-bottom:0;gap:12px;overflow:visible;}
.hero-copy{padding:0;position:relative;z-index:1;}
.hero .eyebrow{font-size:9px;color:var(--muted);letter-spacing:.12em;display:flex;align-items:center;gap:9px;}
.hero .eyebrow:before{content:"";display:inline-block;width:5px;height:5px;background:var(--ink);}
.hero h1{font-size:clamp(37px,3.65vw,60px);line-height:1.22;letter-spacing:-.065em;font-weight:680;margin:18px 0 19px;}
.hero h1 .hero-line{display:block;white-space:nowrap;}
.hero h1 .second{color:#747474;font-weight:400;margin-top:6px;letter-spacing:-.075em;}
.hero p{font-size:13px;max-width:460px;line-height:1.95;color:var(--muted);}
.hero-actions{margin-top:25px;gap:12px;flex-wrap:wrap;}
.hero-actions .btn.ghost{font-size:12px;font-weight:500;}
.hero-actions .btn.primary{border-radius:11px;}
.signal-scene{min-width:0;position:relative;isolation:isolate;min-height:300px;height:100%;display:flex;align-items:center;justify-content:center;}
.signal-art{width:100%;height:auto;max-width:440px;overflow:visible;transform:rotate(-6deg);transition:transform 1.2s cubic-bezier(.2,.8,.2,1);color:var(--ink);}
.signal-scene:hover .signal-art{transform:rotate(3deg) scale(1.025);}
.signal-scene:before{content:"";position:absolute;width:190px;height:28px;left:50%;bottom:36px;transform:translateX(-50%) rotate(-8deg);background:radial-gradient(ellipse,#0000000b,transparent 70%);filter:blur(9px);z-index:-1;}
.signal-caption{position:absolute;bottom:1px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:15px;font-family:Consolas,monospace;font-size:8px;letter-spacing:.14em;color:#858585;}
.signal-caption span:nth-child(2){width:40px;height:1px;background:#c5c5c5;}
.signal-coordinate{position:absolute;top:7px;right:8px;font-family:Consolas,monospace;font-size:8px;letter-spacing:.07em;color:#999;text-align:right;}
.signal-coordinate span{display:block;margin-top:4px;}
.signal-label{position:absolute;left:8%;bottom:46px;display:flex;gap:7px;align-items:center;color:var(--body);background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:7px 10px;font-size:10px;box-shadow:0 4px 18px #00000003;}
.signal-label .icon{width:13px;height:13px;}
.home-metrics-head{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:19px;margin-top:10px;}
.home-metrics-head .eyebrow{font-size:9px;letter-spacing:.09em;}
.home-metrics-head .text-link{font-size:10px;}
.stat-grid{border:0;border-bottom:1px solid var(--line);gap:0;grid-template-columns:repeat(4,minmax(0,1fr));padding:19px 0 22px;margin-bottom:29px;}
.stat-card{padding:0 22px;display:flex;gap:15px;align-items:center;border:0;border-radius:0;background:transparent;box-shadow:none;min-width:0;position:relative;}
.stat-card:first-child{padding-left:0;}
.stat-card+.stat-card{border-left:1px solid var(--line);}
.stat-card:hover{transform:none;box-shadow:none;border-color:var(--line);background:transparent;}
.stat-card:after{content:"↗";position:absolute;right:18px;top:4px;color:var(--muted);font-size:12px;opacity:0;transform:translate(-3px,3px);transition:.2s;}
.stat-card:hover:after{opacity:1;transform:none;}
.stat-icon,.stat-icon.amber,.stat-icon.green,.stat-icon.gray{display:none;}
.stat-card .stat-copy{display:flex;gap:13px;align-items:center;min-width:0;}
.stat-number{font-size:38px;line-height:1.1;letter-spacing:-.06em;font-weight:450;font-variant-numeric:tabular-nums;color:var(--ink);}
.stat-label{font-size:11px;color:var(--body);line-height:1.7;margin-top:0;}
.stat-label small{display:block;color:var(--muted);font-size:9px;line-height:1.5;margin-top:3px;}
.today-grid{grid-template-columns:minmax(0,1.52fr) minmax(280px,1fr);gap:24px;}
.section-head{margin-bottom:16px;}
.section-head h2{font-size:15px;letter-spacing:-.015em;}
.section-index{display:inline-block;font:10px Consolas,monospace;letter-spacing:.02em;color:var(--muted);margin-right:10px;}
.featured-task{padding:25px;border:1px solid #d6d6d6;border-radius:17px;background:var(--surface);box-shadow:0 4px 25px #00000002;}
.featured-task:before{display:none;}
.featured-task h3{font-size:21px;line-height:1.65;font-weight:580;letter-spacing:-.025em;margin:22px 0 9px;}
.featured-task p{font-size:12px;line-height:1.9;}
.featured-context{border-bottom:1px solid var(--line);padding:18px 0 20px;margin-bottom:18px;color:var(--muted);gap:14px;}
.featured-context span{font-size:10px;}
.featured-task .btn.primary{border-radius:9px;font-size:12px;}
.featured-task .featured-meta-name{font-size:12px;font-weight:570;}
.task-row{padding:17px 0;gap:12px;align-items:center;}
.task-title{font-size:12px;line-height:1.8;}.task-meta{font-size:10px;}
.task-row>.icon{width:14px;}
.task-row .badge{font-size:9px;}
.insight{padding:25px;background:var(--soft);border-color:var(--soft);box-shadow:none;}
.insight h3{font-size:13px;}
.insight-quote{font-size:21px;line-height:1.8;letter-spacing:-.035em;font-weight:450;padding:23px 0 16px;}
.insight-source{font-size:10px;}
.insight .badge{background:var(--surface);}
.insight>p{font-size:12px!important;}
.flow-card{padding:25px;box-shadow:none;border:1px solid var(--line);}
.flow-card h3{font-size:14px;}.flow-card p{font-size:12px!important;}
.workflow-mini{padding:24px 3px 5px;font-size:10px;}
.workflow-mini span{gap:8px;}.workflow-mini span .icon{width:19px;height:19px;color:var(--ink);}
.quiet-banner{background:var(--soft);border:0;border-radius:9px;color:var(--muted);font-size:10px;padding:12px;}
/* Task workspace — comfortable reading, single primary action. */
.workspace-title{gap:24px;margin-bottom:26px;}
.workspace-title h1{font-size:29px;font-weight:640;letter-spacing:-.04em;line-height:1.5;max-width:890px;}
.task-meta-line{margin-top:12px;gap:7px;}
.phase-bar{background:var(--surface);border:0;border-bottom:1px solid var(--line);border-radius:0;margin-bottom:26px;overflow:visible;}
.phase-step{padding:14px 10px 18px;font-size:12px;gap:10px;position:relative;color:#888;}
.phase-step+.phase-step{border-left:0;}
.phase-step.active{background:transparent;color:var(--ink);font-weight:600;}
.phase-step.active:after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--ink);}
.phase-step.done{color:#666;}
.step-num{border:0;background:var(--soft);height:25px;width:25px;border-radius:8px;font:10px Consolas,monospace;}
.phase-step.active .step-num{background:var(--ink);color:var(--surface);}
.workspace-grid{grid-template-columns:minmax(0,1.75fr) minmax(278px,1fr);gap:24px;}
.review-grid{grid-template-columns:minmax(0,1.9fr) minmax(280px,1fr);gap:24px;}
.card-header{padding:20px 23px;}.card-header h3{font-size:14px;}
.tabs{gap:26px;padding:0 23px;}
.tab{font-size:12px;padding:17px 0 15px;color:var(--muted);}
.tab.active{color:var(--ink);border-bottom-color:var(--ink);}
.chat-content{padding:26px 24px;min-height:350px;max-height:670px;}
.message{gap:12px;margin-bottom:25px;}.message-head{font-size:10px;margin-bottom:9px;}.message-head strong{font-size:12px;}
.message-text{font-size:13px;line-height:2;color:var(--body);}
.message.user .message-text{border:0;background:var(--soft);padding:13px 16px;border-radius:2px 13px 13px 13px;}
.context-inline{background:var(--soft);border:1px solid var(--line);padding:14px;border-radius:10px;font-size:12px;}
.context-inline small{color:var(--muted);font-size:10px;line-height:1.7;}
.question{background:var(--surface);border:1px solid #c7c7c7;border-radius:14px;padding:21px;box-shadow:0 8px 22px #00000005;}
.question .eyebrow{font-size:9px;color:var(--muted);}
.question h3{font-size:17px;line-height:1.8;letter-spacing:-.025em;margin:8px 0 5px;}
.question p{font-size:11px;line-height:1.9;}
.choices{gap:8px;margin-top:19px;}
.choice{font-size:11px;background:var(--surface);color:var(--body);border:1px solid var(--line);border-radius:9px;padding:11px 12px;transition:.18s;}
.choice:hover,.choice.selected{background:var(--ink);color:var(--surface);border-color:var(--ink);}
.choices .choice:first-child{border-color:#777;color:var(--ink);}
.choices .choice:first-child:hover{color:var(--surface);}
.suggestions{gap:8px;padding:0 23px 14px;}
.suggestion{color:var(--muted);font-size:10px;border-radius:6px;border-color:var(--line);background:var(--surface);padding:6px 8px;}
.suggestion:hover{color:var(--ink);border-color:#aaa;}
.composer{padding:16px 20px;background:var(--surface);}
.composer-box{background:var(--surface);border:1px solid #d8d8d8;border-radius:13px;padding:10px;box-shadow:0 2px 8px #00000002;}

function taskRow(t){return `<button class="task-row" data-act="open-task" data-id="${t.id}"><span class="project-icon ${t.project==='fieldnotes'?'purple':t.project==='website'?'teal':''}">${icon(t.icon||'file')}</span><div class="grow"><div class="task-title">${esc(T(t.title))}</div><div class="task-meta"><span>${esc(projectName(t.project))}</span><span>·</span><span>${t.time||'10:32'}</span></div></div>${statusBadge(t.status)}${icon('chevron','muted')}</button>`;}
function phaseIndex(){return ['clarify'].includes(S.main.phase)?0:S.main.phase==='plan'?1:['running','blocked','cancelled'].includes(S.main.phase)?2:3;}
function workspaceView(){const phases=[L('聊清需求','Clarify'),L('批准范围','Approve scope'),L('后台执行','Execute'),L('证据验收','Review')],pi=phaseIndex();return `<div class="workspace-title"><div><button class="text-link" data-act="nav" data-view="today" style="font-size:10px;padding:0;margin-bottom:8px">${icon('back')}${L('回到今天','Back to today')}</button><h1>${esc(mainTitle())}</h1><div class="task-meta-line">${badge('Northstar Portal','','grid')}<span class="tag">SD-1042</span><span class="tag">${L('方案','Plan')} v${S.main.revision}</span>${statusBadge(S.main.failure?'blocked':S.main.phase)}<span class="tag">${L('本地工作区 · 示例','Local workspace · Mock')}</span></div></div>${btn(L('场景切换','Scenarios'),'scenarios','','more')}</div><nav class="phase-bar" aria-label="${L('任务阶段','Task stages')}">${phases.map((p,i)=>`<button class="phase-step ${i===pi?'active':i<pi?'done':''}" data-act="phase" data-index="${i}" ${i===pi?'aria-current="step"':''}><span class="step-num">${i<pi?icon('check'):String(i+1).padStart(2,'0')}</span>${p}</button>`).join('')}</nav>${S.main.phase==='clarify'?clarifyView():S.main.phase==='plan'?planView():S.main.phase==='running'?runningView():S.main.phase==='blocked'||S.main.phase==='cancelled'?blockedView():S.main.phase==='delivered'?deliveredView():S.main.phase==='accepted'?acceptedView():reviewView()}`;}
function message(who,text,time='10:32'){return `<div class="message ${who==='user'?'user':''}">${who==='user'?'<span class="avatar">YW</span>':`<span class="brand-logo ai">${brandGlyph()}</span>`}<div class="grow"><div class="message-head"><strong>${who==='user'?L('你','You'):'SayDo'}</strong><span>${time}</span>${who!=='user'?`<span>${L('模拟回复','Scripted response')}</span>`:''}</div><div class="message-text">${text}</div></div></div>`;}
function composer(){return `<div class="suggestions"><button class="suggestion" data-act="quick-chat" data-key="why">${L('为什么只问这一题？','Why just one question?')}</button><button class="suggestion" data-act="source" data-id="brief">${L('看看项目依据','Show the project sources')}</button><button class="suggestion" data-act="voice">${L('体验模拟语音','Try simulated voice')}</button></div><form class="composer" id="chat-form"><div class="composer-box"><button type="button" class="mic-btn" data-act="voice" title="${L('模拟语音，不访问麦克风','Simulated voice; no microphone access')}" aria-label="${L('模拟语音','Simulated voice')}">${icon('mic')}</button><textarea id="chat-input" rows="1" placeholder="${L('输入一句想法，或选择示例对话…','Type a thought or choose a sample conversation…')}" aria-label="${L('对话输入','Message input')}"></textarea><button type="button" class="icon-btn" data-act="attach" title="${L('选择示例资料','Attach sample sources')}" aria-label="${L('选择示例资料','Attach sample sources')}" style="background:transparent;border:0">${icon('attach')}</button><button class="send-btn" type="submit" aria-label="${L('发送演示消息','Send demo message')}">${icon('send')}</button></div><div class="composer-note"><span>${L('预设对话演示 · 未调用语言模型','Scripted demo · No language model is called')}</span><span>Enter ↵ <span class="mini-hide">· Shift + Enter ${L('换行','for a new line')}</span></span></div></form>`;}
function clarifyView(){return `<div class="workspace-grid"><section class="card chat-card"><div class="tabs" role="tablist"><button class="tab ${S.focusTab==='conversation'?'active':''}" data-act="focus-tab" data-tab="conversation" role="tab" aria-selected="${S.focusTab==='conversation'}">${L('对话','Conversation')}</button><button class="tab ${S.focusTab==='context'?'active':''}" data-act="focus-tab" data-tab="context" role="tab" aria-selected="${S.focusTab==='context'}">${L('本次上下文','Task context')}</button><button class="tab ${S.focusTab==='history'?'active':''}" data-act="focus-tab" data-tab="history" role="tab" aria-selected="${S.focusTab==='history'}">${L('决策轨迹','Decision trail')}</button></div>${S.focusTab==='context'?contextBody():S.focusTab==='history'?historyBody():`<div class="chat-content" id="chat-content">${message('user',esc(mainTitle()),'10:28')}${message('ai',`${L('我找回了你已经确认的两条约束：<strong>仅导出面向用户的字段</strong>，以及<strong>只允许管理员操作</strong>。这些不需要重新问你。','I found two decisions you have already confirmed: <strong>export user-facing fields only</strong> and <strong>restrict access to admins</strong>. No need to ask you again.')}<div class="context-inline">${icon('check-circle','green')}<div class="grow"><strong>${L('相关资料已整理','Relevant context is prepared')}</strong><br><small>${L('示例代码、项目规范与历史决定 · 可查看来源','Sample code, project rules and decisions · Sources available')}</small></div><button class="text-link" data-act="focus-tab" data-tab="context">${icon('chevron')}</button></div>${L('还有一个会影响验收的选择。','One choice will change what we verify.')}`, '10:29')}${!S.main.scope?`<div style="margin-left:39px"><div class="question" id="scope-question"><div class="eyebrow">${L('只问会改变结果的问题','ONE QUESTION THAT CHANGES THE OUTCOME')}</div><h3>${L('点击导出后，应该得到哪些用户？','Which users should the export include?')}</h3><p>${L('推荐沿用当前页面筛选，避免下载与眼前数据不一致。','Keep the current filters so the download matches what the user sees.')}</p><div class="choices">${[['filtered',L('当前筛选 · 推荐','Current filters · Recommended')],['all',L('全部用户','All users')],['date',L('指定日期范围','A date range')]].map(([v,t])=>`<button class="choice" data-act="scope" data-value="${v}">${t}</button>`).join('')}</div></div></div>`:`${message('user',esc(scopeText()),'10:30')}${message('ai',L('收到。我会把范围、样例和验收标准放到同一份方案里。你批准之后，才开始推进。','Understood. I’ll keep scope, a sample result and acceptance criteria in one plan. Execution starts only after your approval.'),'10:31')}<div style="margin-left:39px">${btn(L('查看开工方案','Review the proposed plan'),'build-plan','primary','arrow')}</div>`}${S.main.messages.map(m=>message(m.who,esc(T(m.text)),m.time||'10:32')).join('')}</div>`}${composer()}</section><aside class="stack">${readinessCard()}${projectContextCard()}</aside></div>`;}
function readinessCard(){return `<div class="card context-card"><div class="between"><h3>${L('开工前，已对齐什么','Before we start')}</h3>${badge(L('来源可查','Traceable'),'blue','shield')}</div><div class="mt16">${[[L('产出与目标明确','Outcome and goal'),true],[L('允许导出的字段已确认','Approved field allowlist'),true],[L('访问权限已有依据','Access requirements'),true],[L('导出数据范围','Export scope'),!!S.main.scope]].map(([t,ok])=>`<div class="readiness-line">${icon(ok?'check-circle':'circle',ok?'green':'blue')}<span>${t}</span>${!ok?`<span class="badge blue" style="margin-left:auto;font-size:8px">${L('待你选择','Your choice')}</span>`:''}</div>`).join('')}</div><div class="ready-notice">${S.main.scope?L('关键项已对齐，可以准备方案；这还不是执行授权。','Key items are aligned. We can prepare a plan; this is not execution permission.'):L('3 项已有依据，1 项需要你选择。<br>不使用“理解百分比”代替判断。','3 items have evidence; 1 needs your choice.<br>No invented “understanding percentage”.')}</div></div>`;}

function contextBody(){return `<div class="chat-content"><div class="narrative"><h3>${L('为什么这些资料与当前任务有关','Why these sources matter')}</h3><p>${L('我们不是把整个项目塞进对话，而是保留会改变这次实现或验收的依据。下列内容是为演示构造的项目上下文。','Rather than loading an entire repository into chat, we keep the evidence that changes implementation or acceptance. The context below is constructed for this demo.')}</p><div class="subcard mt16"><h4>${L('已确认 · 字段与权限','Confirmed · Fields and access')}</h4><p class="mt8">${L('name、email、role、status、created_at 可以导出；internal_id、risk_score 不可导出。管理员检查必须在接口端执行。','name, email, role, status and created_at may be exported. internal_id and risk_score may not. Admin access must be enforced at the endpoint.')}</p>${textLink(L('查看用户确认来源','View the confirmed source'),'memory-detail','arrow','data-id="m1"')}</div><div class="subcard mt16"><h4>${L('需要现场核实 · 当前实现','Check at execution · Current implementation')}</h4><p class="mt8">${L('现有用户页面包含状态筛选。执行前需要核对接口参数是否仍与页面一致。','The existing users page has a status filter. The endpoint parameters must be rechecked against the current page before execution.')}</p>${textLink(L('查看示例实现','View sample implementation'),'source','arrow','data-id="schema"')}</div><div class="subcard mt16"><h4>${L('不作为事实 · 未确认假设','Not a fact · Unconfirmed assumption')}</h4><p class="mt8">${L('50,000 行上限是 AI 提名，不是已授权要求。演示不会据此自动修改任务范围。','The 50,000-row limit is an AI candidate, not an approved requirement. It does not automatically change this task’s scope.')}</p>${textLink(L('检查候选记忆','Inspect candidate memory'),'memory-detail','arrow','data-id="m4"')}</div></div></div>`;}
function historyBody(){return `<div class="chat-content"><div class="narrative"><h3>${L('决定如何演进','How the decision evolved')}</h3><p>${L('已被替代的决定可以追溯，但不会继续充当新任务的依据。','Superseded decisions stay traceable without becoming current instructions.')}</p></div><div class="timeline" style="padding:25px 0 0">${[[L('仅导出面向用户的字段','Only user-facing fields'),L('你确认了允许字段，并替代“全部字段”的旧方案。','You confirmed the allowlist, replacing the earlier “all fields” proposal.'),'09.09'],[L('导出仅限管理员','Restrict export to admins'),L('来自用户确认，不是模型自行授予的权限。','A user-confirmed boundary, not a permission granted by the model.'),'09.08'],[L('旧方案已失效','Earlier proposal superseded'),L('保留来源与历史，不再进入当前执行依据。','Its source and history are retained, but it is no longer current evidence.'),'09.05']].map(([h,p,time])=>`<div class="timeline-item"><span class="timeline-node done">${icon('check')}</span><div class="grow"><h4>${h}</h4><p>${p}</p></div><time>${time}</time></div>`).join('')}</div></div>`;}

function planView(){return `<div class="workspace-grid"><section class="card"><div class="card-header"><div class="flex"><span class="project-icon">${icon('file')}</span><div><h3>${L('开工方案','Decision package')} v${S.main.revision}</h3><span class="small muted" style="font-size:9px">${L('准备好提议 · 尚未授权','Ready to propose · Not yet authorized')}</span></div></div>${btn(L('调整方案','Revise plan'),'edit-plan','sm','edit')}</div><div class="plan-summary"><div class="eyebrow">${L('你会得到什么','THE OUTCOME')}</div><p class="lede">${L(`在现有用户后台增加 <strong>${esc(S.main.label)}</strong> 入口，下载<strong>${esc(scopeText())}</strong>；只保留允许字段，并继承管理员权限。`,`Add <strong>${esc(S.main.label)}</strong> to the existing users page. Download <strong>${esc(scopeText().toLowerCase())}</strong> with the approved fields and admin-only access.`)}</p><div class="grid2"><div class="plan-box in"><h4>${icon('check-circle','green')}${L('这次会做','In scope')}</h4><ul class="list-clean">${[L('沿用现有页面筛选与交互','Reuse existing filters and UI patterns'),L('显式字段白名单与接口权限检查','Use an explicit field allowlist and endpoint authorization'),L('加入编码、权限与空结果检查','Check encoding, permissions and empty results')].map(t=>`<li>${icon('check','green')}<span>${t}</span></li>`).join('')}</ul></div><div class="plan-box out"><h4>${icon('x','muted')}${L('这次不会做','Out of scope')}</h4><ul class="list-clean">${[L('不导出内部 ID 或风险评分','No internal IDs or risk scores'),L('不重构整个后台，不新增第三方依赖','No dashboard rewrite or new third-party dependency'),L('不自动合并、部署或外发数据','No automatic merge, deployment or external delivery')].map(t=>`<li>${icon('x','muted')}<span>${t}</span></li>`).join('')}</ul></div></div><div class="mt24"><div class="section-head"><h3>${L('怎样判断做对了','How we will check the result')}</h3>${badge(L('5 项检查 + 1 项人工判断','5 checks + 1 human judgment'),'blue')}</div>${criteria().map(c=>`<div class="readiness-line">${icon(c.type==='human'?'image':'circle',c.type==='human'?'blue':'muted')}<span>${c.title}</span></div>`).join('')}</div><div class="scope-strip"><div class="flex">${icon('shield')}<div><strong>${L('范围清楚，授权才有效','Clear scope makes approval meaningful')}</strong><div class="small muted" style="font-size:9px;margin-top:3px">${L('计划变化后需重新确认；合并需要独立的身份确认。','A changed plan needs new approval. Merge requires a separate identity confirmation.')}</div></div></div></div></div><div class="approval-foot"><p>${L('仅执行该版计划，最终交付仍由你决定。','Approve this version only. Final delivery remains your decision.')}</p>${btn(L('暂不开始','Not now'),'defer-plan','','clock')}${btn(L('确认范围并开始','Approve scope & start'),'approve','primary','play')}</div></section><aside class="stack"><div class="card context-card"><h3>${L('预计步骤','Proposed steps')}</h3>${[[L('核对工作区与当前资料','Check the workspace and sources'),L('AI · 只读','AI · Read-only')],[L('实现并生成验证证据','Implement and collect evidence'),L('AI · 已批准工作区','AI · Approved workspace')],[L('逐项验收结果','Review the result against criteria'),L('你 · 判断结果','You · Acceptance')],[L('单独确认合并','Confirm merge separately'),L('你 · 已认证屏幕','You · Authenticated screen')]].map(([t,o],i)=>`<div class="plan-step"><span class="seq">${i+1}</span><div><strong>${t}</strong><small>${o}</small></div></div>`).join('')}</div><div class="card context-card"><div class="between"><h3>${L('成果样例','Outcome sample')}</h3>${badge(L('样例，不是已完成成果','Sample, not completed work'),'')}</div><div class="mt16">${miniPreview(true)}</div><p class="context-note">${L('这是可操作的样例，用于确认期待；真实执行尚未开始。','An interactive sample to align expectations; execution has not started.')}</p></div><div class="card context-card"><div class="between"><h3>${L('预算与边界','Budget & boundaries')}</h3>${icon('coins','muted')}</div><div class="key-value"><span>${L('预计费用','Expected cost')}</span><strong>${L('尚无确切数字','Not yet known')}</strong></div><div class="key-value"><span>${L('任务预算上限','Task budget cap')}</span><strong>¥${S.budget.toFixed(2)} <small class="muted">${L('示例','mock')}</small></strong></div><div class="key-value"><span>${L('当前执行模式','Execution mode')}</span><strong>${L('逐步确认' function memoryView(){let list=S.memories.filter(m=>m.status!=='forgotten').filter(m=>S.project==='all'||m.project===S.project);const all=[...list];if(S.memoryFilter!=='all')list=list.filter(m=>m.status===S.memoryFilter);return `<div class="page-heading"><div><h1>${L('记得的不只是内容，是你的决定。','Remember the decisions, not just the conversation.')}</h1><p>${L('来源、版本与有效性一起保留。候选不冒充事实，旧决定不静默复活。','Sources, versions and validity stay together. Candidates are not facts; old decisions do not quietly return.')}</p>${btn(L('导出记忆','Export memory'),'export-memory','','download')}</div><div class="between wrap mb16"><div class="filters" style="margin:0">${[['all',L('全部记忆','All memory')],['confirmed',L('已确认','Confirmed')],['candidate',L('待确认','Candidates')],['superseded',L('已替代','Superseded')]].map(([v,t])=>`<button class="filter ${S.memoryFilter===v?'active':''}" data-act="memory-filter" data-filter="${v}">${t}</button>`).join('')}</div><input class="search-input" id="memory-search" placeholder="${L('搜索决定或来源…','Search decisions or sources…')}" aria-label="${L('搜索记忆','Search memory')}" data-input="memory-search"></div><div class="card" style="overflow:hidden"><div class="memory-header"><div class="between"><div class="flex">${icon('book','blue')}<h3>${S.project==='all'?L('跨项目记忆账本','Project memory ledger'):esc(projectName(S.project))}</h3>${badge(L('演示数据 · 可编辑','MOCK DATA · EDITABLE'),'blue')}</div><div class="memory-counts"><span><strong>${all.filter(m=>m.status==='confirmed').length}</strong>${L('已确认','confirmed')}</span><span><strong>${all.filter(m=>m.status==='candidate').length}</strong>${L('待确认','candidates')}</span><span><strong>${all.filter(m=>m.status==='superseded').length}</strong>${L('已替代','superseded')}</span></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>${L('决定 / 约束','Decision / constraint')}</th><th>${L('状态','Status')}</th><th>${L('来源','Source')}</th><th>${L('操作','Actions')}</th></tr></thead><tbody id="memory-rows">${list.map(m=>memoryRow(m)).join('')}</tbody></table></div><div id="memory-empty" class="empty" style="display:${list.length?'none':'block'}">${L('没有符合条件的记忆。','No matching memory.')}</div></div><div class="grid2 mt24"><div class="card pad"><div class="flex">${icon('shield','blue')}<h3>${L('有来源，才有可信的上下文','Trust starts with a source')}</h3></div><p class="context-note">${L('“用户确认”“模型提名”“项目规范”拥有不同身份。点击任一记忆可检查来源、修改内容或确认候选。','User confirmations, AI candidates and project rules have different authority. Open any entry to inspect, edit or confirm it.')}</p></div><div class="card pad"><div class="flex">${icon('refresh','blue')}<h3>${L('你改主意，记忆也要改变','When you change your mind, memory should follow')}</h3></div><p class="context-note">${L('编辑会创建新的示例版本；遗忘会从这个浏览器的演示状态移除内容。不涉及真实备份或服务器。','Edits create a new sample revision. Forgetting removes content from this browser’s demo state, not from any real server or backup.')}</p></div></div>`;}
function memoryRow(m){let status={confirmed:[L('已确认','Confirmed'),'green'],candidate:[L('候选 · 待确认','Candidate'),'amber'],superseded:[L('已替代','Superseded'),'']}[m.status];return `<tr data-memory-row data-search="${esc((T(m.title)+' '+T(m.text)+' '+T(m.source)).toLowerCase())}"><td><button class="cell-button" data-act="memory-detail" data-id="${m.id}"><div class="cell-title">${esc(T(m.title))}</div><div class="cell-sub">${esc(projectName(m.project))} · v${m.revision} · ${m.date}</div></button></td><td>${badge(status[0],status[1])}</td><td style="font-size:10px">${esc(T(m.source))}</td><td><div class="row-actions">${ibtn('edit','memory-edit',L('编辑这条记忆','Edit this memory'),`data-id="${m.id}"`)}${ibtn('trash','memory-forget',L('遗忘这条记忆','Forget this memory'),`data-id="${m.id}"`)}</div></td></tr>`;}

function artifactsView(){let list=artifacts.filter(a=>S.artifactFilter==='all'||a.category===S.artifactFilter);return `<div class="page-heading"><div><h1>${L('从依据，到可带走的成果。','From source material to portable outcomes.')}</h1><p>${L('每份资料都有用途，每个产物都能查看。所有内容都是为本次演示构造的样例。','Every source has a purpose; every artifact can be inspected. All content is constructed for this demo.')}</p>${btn(L('导出模拟交付包','Export mock bundle'),'download-bundle','','download')}</div><div class="filters">${[['all',L('全部','All')],['docs',L('文档','Documents')],['code',L('代码 / 差异','Code / diff')],['data',L('示例数据','Sample data')]].map(([v,t])=>`<button class="filter ${S.artifactFilter===v?'active':''}" data-act="artifact-filter" data-filter="${v}">${t}</button>`).join('')}</div><div class="artifact-grid">${list.map(a=>`<button class="card artifact-card" data-act="artifact" data-id="${a.id}"><div class="artifact-thumb">${icon(a.icon)}<div class="skeleton-lines"><i></i><i></i><i></i></div></div><h3>${a.title}</h3><p>${T(a.sub)}</p><div class="artifact-foot"><span>Northstar Portal</span><span>${a.version==='current'?'v'+S.main.revision:a.version==='illustrative'?L('片段','Snippet'):a.version==='sample'?L('示例','Sample'):a.version}</span></div></button>`).join('')}</div><div class="quiet-banner mt24">${icon('info')}<span>${L('资料页允许查看样例，不代表任务已经执行。验收记录会按当前阶段明确标注未运行、已检查或已接受。','Viewing samples does not mean work has executed. The review record states what is unrun, checked or accepted at the current stage.')}</span></div>`;}
function agentsView(){return `<div class="page-heading"><div><h1>${L('能力各司其职，控制保持清楚。','Different roles. One clear control boundary.')}</h1><p>${L('对话负责理解，执行负责推进。你始终知道这一次使用了什么。','Conversation clarifies; execution advances. You can see which role is doing what.')}</p>${btn(L('体验首次设置','Explore onboarding'),'nav','','settings','data-view="onboarding"')}</div><div class="artifact-grid provider-grid"><div class="card provider-card"><div class="between"><span class="project-icon">${icon('terminal')}</span>${badge(L('示例执行后端','MOCK EXECUTOR'),'blue')}</div><h2>Claude Code</h2><p>${L('承担已批准任务的本地执行。此 Demo 使用确定性脚本模拟事件，不启动 CLI，也不读取你的登录状态。','Executes approved work in a local workspace. This demo simulates events deterministically; it does not launch a CLI or read your login state.')}</p><div class="provider-roles">${badge(L('开发档','EXECUTION'))}${badge(L('逐步确认','STEP CONFIRMATION'))}</div>${btn(L('运行模拟连接检查','Run simulated check'),'provider-check','soft','refresh')}</div><div class="card provider-card"><div class="between"><span class="project-icon purple">${icon('message')}</span>${badge(L('未连接实际服务','NO LIVE CONNECTION'),'')}</div><h2>${L('对话与思考','Conversation & reasoning')}</h2><p>${L('展示采访、项目资料与方案形成的交互。演示回复为预设内容，不使用真实 API，不要求输入密钥。','Illustrates interviewing, project context and plan formation. Replies are scripted, with no real API and no request for credentials.')}</p><div class="provider-roles">${badge(L('对话档','DIALOG'))}${badge(L('思考档','REASONING'))}</div>${btn(L('查看数据去向','Inspect data boundaries'),'privacy','','shield')}</div><div class="card provider-card"><div class="between"><span class="project-icon teal">${icon('shield')}</span>${badge(L('当前基线限制','BASELINE LIMIT'),'amber')}</div><h2>${L('独立语义深评','Independent deep review')}</h2><p>${L('基线中规则就绪门存在，但独立语义深评未获得真实生产输入。这里不将动画或完成标记伪装成模型评估。','The baseline has a rules-based readiness gate, but independent deep review lacks live production evidence input. This UI does not pretend a model assessment ran.')}</p><div class="provider-roles">${badge(L('设计能力','DESIGNED CAPABILITY'))}</div>${btn(L('查看能力说明','Read capability notes'),'about','','info')}</div></div><div class="grid2 mt24"><div class="card pad"><h3>${L('SayDo 不替你放弃控制权','SayDo does not ask you to surrender control')}</h3><div class="connection-map"><div class="node"><div class="node-box">${icon('message')}</div>${L('沟通与理解','Conversation')}</div>${icon('arrow')}<div class="node"><div class="node-box">${icon('shield')}</div>${L('范围与授权','Scope & approval')}</div>${icon('arrow')}<div class="node"><div class="node-box">${icon('terminal')}</div>${L('受控执行','Controlled execution')}</div></div><p class="context-note">${L('此图表达职责边界，不声称所有平台与适配器具有相同权限能力。','This diagram shows responsibilities, not identical capabilities across every platform and adapter.')}</p></div><div class="card pad"><div class="between"><h3>${L('跨设备，先分清当前与未来','Separate today’s product from cross-device plans')}</h3>${icon('phone','blue')}</div><p class="context-note">${L('本文件已适配平板和手机浏览器，但这是响应式交互预演。当前项目基线的远程业务面被关闭，不能用这个 Demo 证明已经上线。','This file adapts to tablets and phones as a responsive concept. Remote business APIs are closed in the reviewed baseline; this demo is not evidence that remote operation has shipped.')}</p>${textLink(L('查看设备体验说明','See device experience notes'),'devices')}</div></div>`;}
function costView(){let cost=mockCost();return `<div class="page-heading"><div><h1>${L('看清成本，不用猜数字。','Clear costs. No invented certainty.')}</h1><p>${L('以下金额是演示用的记账样例，不是真实费用、客户收益或经营指标。','These are illustrative cost entries, not real charges, customer savings or business metrics.')}</p>${btn(L('下载示例账本','Download mock ledger'),'export-cost','','download')}</div><div class="cost-grid"><div class="card cost-tile"><h4>${L('本任务示例累计','This task · Mock total')}</h4><strong>¥${fnum(cost)}</strong><small>SD-1042 · ${L('按演示阶段更新','Updates with the demo stage')}</small></div><div class="card cost-tile"><h4>${L('已设置的示例上限','Configured mock cap')}</h4><strong>¥${fnum(S.budget)}</strong><small>${L('修改不等于授权任何真实扣费','No authorization for real charges')}</small></div><div class="card cost-tile"><h4>${L('实际费用','Actual spend')}</h4><strong style="font-size:21px;line-height:1.7">${L('未发生','Not incurred')}</strong><small>${L('不连接服务，不发生计费','No services called; no billing')}</small></div></div><div class="grid2 mt24"><div class="card pad"><div class="between"><h3>${L('费用构成示例','Illustrative cost breakdown')}</h3>${badge('MOCK DATA','blue')}</div><div class="cost-bar" aria-label="${L('示例费用构成','Illustrative cost composition')}"><i style="width:20%"></i><i style="width:50%"></i><i style="width:20%"></i><i style="width:10%"></i></div>${[[L('对话','Conversation'),.2],[L('执行','Execution'),.5],[L('思考与摘要','Reasoning & summary'),.2],[L('语音','Voice'),.1]].map(([n,r])=>`<div class="key-value"><span>${n}</span><strong>¥${fnum(cost*r)}</strong></div>`).join('')}<p class="context-note">${L('分项仅说明如何展示归因；不代表供应商报价或真实使用比例。','Breakdown illustrates attribution only, not provider pricing or measured usage ratios.')}</p></div><div class="card pad"><h3>${L('预算是边界，不是装饰','A budget is a boundary')}</h3><div class="field mt24"><label for="budget-input">${L('本任务示例上限（人民币）','Mock task cap (CNY)')}</label><input id="budget-input" type="number" min="1" max="500" step="1" value="${S.budget}"><small>${L('范围 1–500。超过边界的模拟任务会停靠，而不自动扩大预算。','Range 1–500. A simulated task parks at its cap instead of raising it automatically.')}</small></div>${btn(L('保存示例预算','Save mock cap'),'save-budget','primary','check')}<div class="divider"></div>${textLink(L('演示一次预算停靠','Try the budget-boundary scenario'),'scenario','arrow','data-scenario="budget"')}</div></div>`;}
function settingsView(){return `<div class="page-heading"><div><h1>${L('安静工作，清楚设置。','Quiet work. Clear preferences.')}</h1><p>${L('设置只保存在当前浏览器的演示状态中，不修改任何真实产品配置。','Preferences belong to this browser demo; no actual product configuration is changed.')}</p>${badge(L('本地演示偏好','LOCAL DEMO PREFERENCES'),'blue')}</div><div class="settings-grid"><div class="stack"><section class="card pad"><h3>${L('显示与交互','Appearance & interaction')}</h3><div class="setting-row"><div><h4>${L('界面语言','Interface language')}</h4><p>${L('切换全部主要页面、任务与演示说明。','Switch the main screens, task narrative and demo notes.')}</p></div>${btn(L('English','简体中文'),'lang','sm')}</div><div class="setting-row"><div><h4>${L('深色外观','Dark appearance')}</h4><p>${L('同一套交互，适应不同演示环境。','The same interactions, suited to a different presentation setting.')}</p></div><button class="switch ${S.theme==='dark'?'on':''}" data-act="theme" role="switch" aria-checked="${S.theme==='dark'}" aria-label="${L('深色外观','Dark appearance')}"></button></div><div class="setting-row"><div><h4>${L('自动推进模拟执行','Auto-advance simulated execution')}</h4><p>${L('关闭后可以在任务页逐步推进，方便现场讲解。','Turn off to advance each simulated step manually during a presentation.')}</p></div><button class="switch ${S.autoRun?'on':''}" data-act="toggle-auto" role="switch" aria-checked="${S.autoRun}" aria-label="${L('自动推进','Auto-advance')}"></button></div></section><section class="card pad"><h3>${L('注意力与预算','Attention & budget')}</h3><div class="setting-row"><div><h4>${L('免打扰窗口','Do-not-disturb window')}</h4><p>22:00–08:00 · ${L('仅保存示例偏好；本文件不发送系统通知。','A sample preference only; this file sends no system notifications.')}</p></div><button class="switch ${S.dnd?'on':''}" data-act="toggle-dnd" role="switch" aria-checked="${S.dnd}" aria-label="${L('免打扰','Do not disturb')}"></button></div><div class="setting-row"><div><h4>${L('当前示例预算','Current mock budget')}</h4><p>${L('未知费用显示未知，而不是伪装成零。','Unknown costs remain unknown, not disguised as zero.')}</p></div>${btn(`¥${fnum(S.budget)}`,'nav','sm','coins','data-view="cost"')}</div></section><section class="card pad"><h3>${L('演示状态','Demo state')}</h3><div class="setting-row"><div><h4>${L('重置到初始场景','Reset to the initial scene')}</h4><p>${L('清除本 Demo 的进度、示例消息与记忆修改，不影响其他浏览器数据。','Reset this demo’s progress, sample messages and memory edits, without touching other browser data.')}</p></div>${btn(L('重置演示','Reset demo'),'reset','sm danger','refresh')}</div><div class="setting-row"><div><h4>${L('导出当前状态','Export current state')}</h4><p>${L('下载 JSON，保留本次演示进度与操作记录。','Download a JSON snapshot of the demo progress and activity.')}</p></div>${btn(L('导出','Export'),'export-state','sm','download')}</div></section></div><aside class="stack"><section class="card context-card"><div class="flex">${icon('shield','blue')}<h3>${L('本文件的数据边界','This file’s data boundary')}</h3></div><div class="context-detail"><p>${L('不访问麦克风，不读取本地项目，不收集密钥，不发送网络请求。所有执行、语音、认证与通知均为模拟。','No microphone access, repository reads, credential collection or network requests. Execution, voice, authentication and notifications are simulated.')}</p></div><div class="context-detail"><p>${storageAvailable?L('当前浏览器允许保存演示状态。刷新后可继续；正在运行的模拟会安全暂停。','This browser allows demo-state persistence. Reload to continue; an active simulation is safely paused.'):L('浏览器限制本地存储，当前仍可演示；刷新后可能无法保留进度。','This browser limits local storage. The demo still works, but progress may not survive a reload.')}</p></div>${textLink(L('完整隐私说明','Full privacy notes'),'privacy')}</section><section class="card context-card"><h3>${L('产品与演示不是同一个版本','The product and the prototype are different')}</h3><p class="context-note">${L('产品分析基线：2026-09-09。此 HTML 展示建议体验，不能作为真实功能或性能已上线的证据。','Product review baseline: Sep 9, 2026. This HTML illustrates a proposed experience, not evidence of shipped capability or measured performance.')}</p>${textLink(L('查看来源与能力边界','Sources & capability boundaries'),'about')}</section></aside></div>`;}
function onboardingView(){let i=S.onboardStep;let body=i===0?`<h2>${L('欢迎，把你的项目交代得更清楚。','Welcome. Give your next project a clearer handoff.')}</h2><p>${L('这是一段完整的首启交互预演。你不需要安装工具或提供账号；下面的检测与连接都在浏览器中模拟。','This is a complete onboarding preview. No tools or accounts are required; all checks and connections below are simulated in the browser.')}</p><div class="grid2"><div class="subcard"><div class="flex">${icon('monitor','blue')}<h3>${L('本地执行面','Local execution')}</h3></div><p class="context-note">${L('项目与执行器在你的电脑上协作。此 Demo 不读取任何文件。','Your project and execution tool work on your computer. This demo reads no files.')}</p></div><div class="subcard"><div class="flex">${icon('shield','blue')}<h3>${L('范围先于动作','Scope before action')}</h3></div><p class="context-note">${L('先明确要做什么，再取得具体授权。','Clarify what should happen, then obtain specific authorization.')}</p></div></div>`:i===1?`<h2>${L('选择示例执行器','Choose a sample execution tool')}</h2><p>${L('用于展示供应方配置体验。不会探测你的系统，也不会调用真实 CLI。','Illustrates provider setup. It does not inspect your system or invoke a real CLI.')}</p>${[['claude','Claude Code',L('示例主线 · 本地任务执行','Featured sample · Local task execution')],['cursor','Cursor CLI',L('备用示例 · 保持相同的授权边界','Alternative sample · Same approval boundary')]].map(([v,n,d])=>`<button class="radio-card ${S.providerChoice===v?'selected':''}" data-act="onboard-provider" data-value="${v}">${icon('terminal','blue')}<span class="grow"><strong>${n}</strong><small>${d}</small></span>${icon(S.providerChoice===v?'check-circle':'circle',S.providerChoice===v?'blue':'muted')}</button>`).join('')}<div class="mt16">${btn(S.providerChecked?L('模拟检查已通过','Simulated check passed'):L('运行模拟检查','Run simulated check'),'onboard-check',S.providerChecked?'success':'soft',S.providerChecked?'check':'refresh')}</div>`:i===2?`<h2>${L('选一个你正在维护的项目','Choose a project you are working on')}</h2><p>${L('明确选择项目，避免跨项目混用上下文。这里使用预置样例，不需要输入路径。','Choose an explicit project to avoid cross-project context. These are preset samples; no path is needed.')}</p>${projects.map(p=>`<button class="radio-card ${S.onboardProject===p.id?'selected':''}" data-act="onboard-project" data-id="${p.id}">${projectIcon(p)}<span class="grow"><strong>${esc(p.name)}</strong><small>${T(p.type)}</small></span>${icon(S.onboardProject===p.id?'check-circle':'circle',S.onboardProject===p.id?'blue':'muted')}</button>`).join('')}`:`<h2>${L('准备好，用一件真实感的任务开始。','Ready. Start with a task that feels real.')}</h2><p>${L('设置预演已完成。接下来用 Northstar Portal 的用户导出任务，完整体验需求、授权、执行和验收。','Onboarding preview is complete. The Northstar Portal export task demonstrates the full request, approval, execution and review journey.')}</p><div class="subcard">${[[L('示例执行器','Sample executor'),S.providerChoice==='claude'?'Claude Code':'Cursor CLI'],[L('所选项目','Selected project'),projectName(S.onboardProject)],[L('麦克风','Microphone'),L('不访问 · 模拟语音可用','Not accessed · Simulated voice available')],[L('外部请求','External requests'),L('禁用 · 完全离线','Disabled · Fully offline')]].map(([a,b])=>`<div class="key-value"><span>${a}</span><strong>${b}</strong></div>`).join('')}</div>`;return `<div class="onboarding"><div class="page-heading"><div><h1>${L('第一次使用，也不需要研究说明书。','A thoughtful first run.')}</h1><p>${L('完整首启概念预演 · 不是真实安装器','Complete onboarding concept · Not an actual installer')}</p>${badge('DEMO','blue')}</div><div class="onboarding-steps">${[L('了解边界','Boundaries'),L('选择执行器','Execution tool'),L('选定项目','Project'),L('准备开始','Ready')].map((t,j)=>`<div class="${i===j?'active':''}"><span class="step-num">${j<i?icon('check'):j+1}</span><span>${t}</span></div>`).join('')}</div><div class="card"><div class="onboarding-main">${body}</div><div class="onboarding-footer">${btn(L('返回','Back'),'onboard-back','ghost','back',i===0?'disabled':'')}<div class="flex">${btn(L('跳过预演','Skip preview'),'nav','ghost','','data-view="today"')}${btn(i===3?L('进入完整演示','Open the full journey'):L('下一步','Continue'),i===3?'start-tour':'onboard-next','primary','arrow',i===1&&!S.providerChecked?'disabled':'')}</div></div></div></div>`;}
function openModal(kind,data={}){modalOpener=document.activeElement;activeModal={kind,...data};renderModal();document.body.style.overflow='hidden';setTimeout(()=>{const f=$('[autofocus]', $('#modal-root'))||$('input:not([type=checkbox]), textarea, button', $('#modal-root'));f?.focus();},35);}
function closeModal(){if(voiceTimer){clearInterval(voiceTimer);voiceTimer=null;}activeModal=null;$('#modal-root').innerHTML='';document.body.style.overflow='';if(modalOpener&&document.contains(modalOpener))modalOpener.focus();}
function modalFrame(title,body,foot='',wide=false,eyebrow='SAYDO · INTERACTIVE DEMO'){return `<div class="modal-backdrop" data-backdrop><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header class="modal-head"><div><div class="eyebrow">${eyebrow}</div><h2 id="modal-title">${esc(title)}</h2></div>${ibtn('x','close-modal',L('关闭','Close'))}</header><div class="modal-body">${body}</div>${foot?`<footer class="modal-foot">${foot}</footer>`:''}</section></div>`;}
function infoBox(text,warning=false){return `<div class="modal-info ${warning?'warning':''}">${icon(warning?'warning':'info')}<span>${text}</span></div>`;}
function renderModal(){if(!activeModal)return;const m=activeModal;let html='';switch(m.kind){
 case'guide':html=modalFrame(L('把想法交代清楚，再把事情交出去。','A clear handoff, from thought to outcome.'),`${infoBox(L('这是完整交互原型，不是真实服务录屏。可从头体验，也可直接进入任一演示场景。所有数据和结果均为模拟。','This is an interactive prototype, not a recording of a live service. Follow the full journey or jump to a scene. All data and outcomes are simulated.'))}<div class="guide-grid">${[['clarify','message',L('01 · 聊清需求','01 · Clarify'),L('找回旧决定，只问关键问题。','Remember decisions. Ask only what matters.')],['plan','shield',L('02 · 批准范围','02 · Approve'),L('查看要做与不做的事。','See what is in and out of scope.')],['running','agent',L('03 · 后台推进','03 · Execute'),L('阶段清楚，可以暂停与恢复。','Clear stages, with pause and recovery.')],['review','check-circle',L('04 · 证据验收','04 · Review'),L('操作样例，核对结果与证据。','Try the sample and inspect the proof.')],['validation','warning',L('05 · 异常与返工','05 · Recover'),L('未通过不能交付，返工不重做。','Failed checks block delivery. Revise precisely.')],['delivered','book',L('06 · 下次不必重讲','06 · Remember'),L('交付后沉淀已确认的决定。','Keep a decision after acceptance.')]].map(([v,i,t,d])=>`<button class="guide-item" data-act="jump" data-scene="${v}">${icon(i)}<strong>${t}</strong><p>${d}</p></button>`).join('')}</div><div class="divider"></div><p style="font-size:11px;color:var(--muted)">${L('建议演示路线：选范围 → 看方案 → 批准 → 模拟执行 → 检查样例 → 验收 → 单独确认合并 → 查看记忆。','Suggested path: choose scope → inspect plan → approve → simulate execution → inspect sample → accept → confirm merge separately → see memory.')}</p>`,`${btn(L('首次设置预演','Onboarding preview'),'nav','','settings','data-view="onboarding"')}${btn(L('从头开始互动导览','Start the guided journey'),'start-tour','primary','play')}`,true);break;
 case'about':html=modalFrame(L('一个可以操作，也讲清边界的 Demo。','A working prototype with clear boundaries.'),`<div class="flex mb16"><span class="brand-logo">${brandGlyph()}</span><div><h2>SayDo</h2><p style="font-size:11px">${L('投资人交互演示 · 2026-09-11','Investor interaction demo · 2026-09-11')}</p></div></div>${infoBox(L('此 HTML 根据本次会话的界面概念和项目审阅文档制作。它展示建议体验，并不是当前已发布产品的逐功能复刻。','This HTML is based on the conversation’s visual concepts and project-review documents. It demonstrates a proposed experience, not a feature-for-feature copy of the released product.'))}<div class="table-wrap"><table class="data-table" style="min-width:0"><thead><tr><th>${L('演示能力','Demo feature')}</th><th>${L('真实边界','Actual boundary')}</th></tr></thead><tbody>${[[L('对话与语音','Conversation & voice'),L('预设回复与转写动画；不访问麦克风或模型。','Scripted replies and transcript animation; no microphone or model access.')],[L('执行、检查、费用','Execution, checks, cost'),L('全部为确定性模拟；不改仓库，不执行代码，不计费。','Deterministic simulations; no repository changes, code execution or charges.')],[L('验收与合并','Acceptance & merge'),L('两个独立演示步骤；身份验证也是模拟，不调用系统认证。','Two separate demo steps; identity verification is simulated, not system authentication.')],[L('手机和平板','Phones & tablets'),L('响应式目标体验。审阅基线的远程业务面尚未开放。','Responsive concept. Remote business APIs are not available in the reviewed baseline.')],[L('就绪、Demo 与资料','Readiness, preview, sources'),L('规则就绪不等于独立模型深评；本页样例不代表真实成果。','Rules-based readiness is not independent deep review; samples are not real outcomes.')]].map(([a,b])=>`<tr><td>${a}</td><td style="font-size:10px">${b}</td></tr>`).join('')}</tbody></table></div><div class="divider"></div><h3>${L('内容依据','Content basis')}</h3><p class="mt8" style="font-size:11px">${L('《SayDo 最终合并建议与行动路线 v2.0》、本会话 UI 概念图及《SayDo 最终综合建议》。项目审阅基线固定为：','SayDo Final Merged Recommendations v2.0, this conversation’s UI concepts and SayDo Final Comprehensive Recommendations. Project review baseline:')}</p><code style="display:block;word-break:break-all;margin:10px 0;color:var(--muted)">${BASELINE}</code><p style="font-size:10px;color:var(--muted)">${L('演示中的 Northstar Portal、用户身份、来源文档、数字和检查记录均为虚构。不展示营收、客户数量、成功率或节省时间等未经验证的经营与性能指标。','Northstar Portal, identities, source documents, numbers and check records are fictional. No unverified revenue, customer count, success-rate or time-savings claims are presented.')}</p>`,`${btn(L('了解数据边界','Data boundaries'),'privacy','','shield')}${btn(L('开始体验','Explore the demo'),'close-modal','primary','arrow')}`,true);break;
 case'privacy':html=modalFrame(L('你的数据，不需要进入这个演示。','Your data does not need to enter this demo.'),`${infoBox(L('单文件离线原型。CSP 禁止网络连接；没有外部脚本、外部字体或分析追踪。','A single-file offline prototype. Its Content Security Policy disallows network connections. No external scripts, fonts or analytics.'))}<div class="narrative"><h3>${L('会保存什么','What is stored')}</h3><p>${L('你在这个 Demo 里选择的范围、模拟任务状态、输入的演示消息、示例记忆修改、语言和显示偏好。浏览器允许时，保存在本文件专用的 localStorage 键下。','Scope choices, simulated task state, demo messages, memory edits, language and appearance preferences. Where supported, they are stored in this file’s dedicated localStorage entry.')}</p><h3>${L('不会做什么','What it does not do')}</h3><p>${L('不读取本地项目或账号，不录音，不获取 API 密钥，不发送消息或邮件，不调用 Agent，不执行代码，不访问真实生物识别。请勿在示例对话中输入敏感内容。','It does not read projects or accounts, record audio, obtain API keys, send messages or email, invoke agents, execute code or use real biometrics. Do not enter sensitive content into the sample conversation.')}</p><h3>${L('怎样清除','How to clear it')}</h3><p>${L('在设置中选择“重置演示”。只清除这个 Demo 的状态；下载过的文件仍在你的下载目录中。','Choose Reset demo in Settings. Only this demo’s state is cleared. Files you already downloaded remain in your download folder.')}</p><h3>${L('产品边界是另一回事','The actual product is different')}</h3><p>${L('真实 SayDo 使用的模型、语音和通知供应方可能涉及外部数据流；本原型的离线性质不能用来证明真实产品所有数据都在本地。','The real SayDo may involve external model, voice and notification services. This prototype’s offline behavior is not evidence that all real-product data stays local.')}</p></div>`,btn(L('我知道了','Understood'),'close-modal','primary'));break;
 case'search':html=`<div class="modal-backdrop" data-backdrop><section class="modal search-modal" role="dialog" aria-modal="true" aria-label="${L('搜索工作空间','Search workspace')}"><div class="command-search">${icon('search','muted')}<input id="command-input" placeholder="${L('搜索任务、记忆、资料或页面…','Search tasks, memory, sources or pages…')}" autocomplete="off" autofocus data-input="command-search" aria-label="${L('搜索内容','Search query')}"><kbd class="key">ESC</kbd></div><div class="command-results" id="command-results">${commandResults('')}</div><div style="padding:12px 22px;border-top:1px solid var(--line);font-size:9px;color:var(--muted)">${L('仅搜索这份演示中的示例内容 · Tab 选择，Enter 打开','Searches only sample content in this demo · Tab to select, Enter to open')}</div></section></div>`;break;

function commandResults(q){q=q.toLowerCase().trim();let results=[...Object.entries({today:['home',L('今天','Today')],workspace:['focus',L('完整任务演示','Full task demo')],tasks:['list',L('全部任务','All tasks')],memory:['book',L('项目记忆','Memory')],artifacts:['folder',L('资料与产物','Artifacts')],agents:['agent',L('执行与连接','Agents')],cost:['coins',L('成本与用量','Cost & usage')],settings:['settings',L('设置','Settings')],onboarding:['settings',L('首次设置','Onboarding')]}).map(([v,[i,n]])=>({i,n,sub:L('页面','Page'),act:'nav',attrs:`data-view="${v}"`})),...allTasks().map(t=>({i:t.icon||'file',n:T(t.title),sub:projectName(t.project),act:'open-task',attrs:`data-id="${t.id}"`})),...S.memories.filter(m=>m.status!=='forgotten').map(m=>({i:'book',n:T(m.title),sub:T(m.source),act:'memory-detail',attrs:`data-id="${m.id}"`}))].filter(r=>!q||(r.n+' '+r.sub).toLowerCase().includes(q));return results.length?`<div class="command-label">${L(`${results.length} 个结果`,`${results.length} results`)}</div>${results.map(r=>`<button class="command-result" data-act="${r.act}" ${r.attrs}>${icon(r.i,'blue')}<span class="grow"><strong>${esc(r.n)}</strong><small>${esc(r.sub)}</small></span>${icon('chevron','muted')}</button>`).join('')}`:`<div class="empty">${icon('search')}<h3>${L('没有找到这条内容','No matching content')}</h3><p>${L('试试“导出”“字段”“Northstar”或“设置”。','Try “export”, “fields”, “Northstar” or “settings”.')}</p></div>`;}
function csvText(){const rows=(!S.main.scope||S.main.scope==='filtered')?filteredUsers():S.main.scope==='all'?mockUsers:mockUsers.filter(u=>u.date>=(S.main.dateFrom||'2026-09-03')&&u.date<=(S.main.dateTo||'2026-09-11'));const cell=x=>'"'+String(x).replace(/"/g,'""')+'"';return 'name,email,role,status,created_at\r\n'+rows.map(u=>[u.name,u.email,u.role,u.status,u.date].map(cell).join(',')).join('\r\n')+'\r\n';}
function artifactText(id){switch(id){case'brief':return `# Northstar Portal — Admin dashboard\n\nDEMO SOURCE · FICTIONAL PROJECT · NOT READ FROM YOUR REPOSITORY\n\nVersion: 1.4\nPurpose: Customer operations workspace\n\n## Existing behavior\n- User table supports status filtering.\n- Administrators can manage user access.\n- UI elements come from the existing design system.\n\n## Confirmed intent\nMake CSV export useful without revealing internal fields.\n\n## Task-specific question\nDoes export follow the current filters, all accessible users, or a date range?\nCurrent sample answer: ${scopeText()}\n\n## Boundaries\nNo new third-party dependency, automatic deployment or external delivery.\nThis document is illustrative, not a verified project scan.`;
case'schema':return `// DEMO SOURCE — illustrative TypeScript, not production code.\n// Fictional schema; no real user data.\n\ninterface User {\n  name: string;\n  email: string;\n  role: 'Admin' | 'Member';\n  status: 'Active' | 'Invited';\n  created_at: string;\n  internal_id: string;  // MUST NOT export\n  risk_score: number;   // MUST NOT export\n}\n\nconst ALLOWED_EXPORT_FIELDS = [\n  'name', 'email', 'role', 'status', 'created_at'\n] as const;\n\n// An endpoint must enforce admin access.\n// Hiding a button is not sufficient authorization.\n// Validation is a separate requirement, not implied by this snippet.`;
case'rules':return `# Northstar project rules\n\nDEMO SOURCE — constructed for the investor prototype.\n\n1. Reuse the existing UI components.\n2. Export only explicitly allowlisted fields.\n3. Check admin permissions at the API boundary.\n4. Keep the current filters unless scope is changed and approved.\n5. Do not add dependencies, deploy or send data externally without approval.\n6. Runner exit is not evidence of delivery.\n7. Confirm acceptance separately from merge.\n8. Superseded decisions are historical, not current instructions.`;
case'csv':return 'DEMO DATA — fictional users at example.com\n\n'+csvText();
case'diff':return `# MOCK DIFF — explanatory fragment, not a deployable patch.\n# Project: Northstar Portal / SD-1042 / v${S.main.revision}\n\n--- exportUsers.ts (before)\n+++ exportUsers.ts (illustrative after)\n- return serialize(allUserFields);\n+ requireAdmin(req.user);\n+ const fields = ALLOWED_EXPORT_FIELDS;\n+ return serialize(pickFields(users, fields));\n\n--- UsersPage.tsx\n+++ UsersPage.tsx\n+ <Button>${S.main.label}</Button>\n\n# Permission enforcement, data selection, CSV escaping and error handling\n# require complete implementation and real tests in the actual product.`;
case'tests':return criteria().filter(c=>c.type==='auto').map(c=>`${S.main.failure&&c.id==='access'?'MOCK FAIL':'MOCK PASS'} — ${c.title}`).join('\n');
case'verification':{const ran=['review','accepted','delivered'].includes(S.main.phase),lines=criteria().map(c=>`- ${c.title}: ${!ran?'NOT RUN':c.type==='human'?(S.main.visualChecked?'USER CONFIRMED IN DEMO':'AWAITING HUMAN JUDGMENT'):(S.main.failure&&c.id==='access'?'MOCK FAIL':'MOCK PASS')}`);return `# SayDo — Mock acceptance record\n\nALL CONTENT IS SIMULATED. NO REAL CODE WAS EXECUTED.\n\nProject: Northstar Portal\nTask: SD-1042\nPlan revision: ${S.main.revision}\nCurrent phase: ${S.main.phase}\nApproved revision: ${S.main.approvedRevision??'Not approved'}\nScope: ${scopeText()}\nButton label: ${S.main.label}\n\n## Acceptance criteria\n${lines.join('\n')}\n\n## Delivery\nAccepted in demo: ${S.main.accepted?'Yes':'No'}\nMock merged: ${S.main.delivered?'Yes':'No'}\nReal repository modified: NO\n\n## Boundaries\n- Source documents and users are fictional.\n- Check output is preset, not a test report from the product.\n- Approval and authentication are simulated.\n- Costs shown are illustrative, not actual billing.\n- Product review baseline: ${BASELINE}\n`;}default:return 'DEMO ARTIFACT — sample content only.';}}
function download(name,content,type='text/plain;charset=utf-8'){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500);}
function exportCsv(){download('SayDo_DEMO_users.csv','\uFEFF'+csvText(),'text/csv;charset=utf-8');toast('已下载示例 CSV：仅含 5 个允许字段。','Sample CSV downloaded: only the 5 allowed fields.');addActivity('下载了示例 CSV。','Downloaded the sample CSV.');}
function exportBundle(){let content=`# SayDo · 模拟交付包 / MOCK DELIVERY BUNDLE\n\nThis file contains fictional demo artifacts, not a real software delivery.\n\n${artifactText('verification')}\n\n---\n\n## Sample data\n\n\`\`\`csv\n${csvText()}\`\`\`\n\n## Illustrative code changes\n\n\`\`\`diff\n${artifactText('diff')}\n\`\`\`\n\n## Approved boundaries\nNo automatic deployment, external data transfer or real repository changes.\n\n## Revision instruction\n${S.main.revisionRequest||'None'}\n\n## Demo activity\n${S.activities.map(a=>`- ${a.time} — ${T(a)}`).join('\n')||'No activity recorded.'}\n`;
 download('SayDo_MOCK_delivery_v'+S.main.revision+'.md',content,'text/markdown;charset=utf-8');toast('模拟交付记录已下载。当前阶段与未运行项已写明。','Mock delivery record downloaded, including the current stage and unrun items.');}
function go(view){closeModal();document.body.classList.remove('menu-open');S.view=view;render();window.scrollTo({top:0,behavior:'instant'});}
function stopRun(){if(runTimer){clearInterval(runTimer);runTimer=null;}}
function scheduleRun(){stopRun();if(S.main.phase!=='running'||S.main.paused||!S.autoRun||!S.connection)return;runTimer=setInterval(()=>{if(S.main.phase!=='running'||S.main.paused||!S.connection){stopRun();return;}advanceExecution();},1800);}
function advanceExecution(){if(S.main.phase!=='running'){return;}if(!S.connection){toast('模拟连接未恢复，任务保持停靠。','Connection has not recovered; work stays parked.','warning');return;}if(S.main.runIndex<4){S.main.runIndex++;addActivity('模拟阶段：'+runSteps()[S.main.runIndex][0],'Simulation stage: '+runSteps()[S.main.runIndex][0]);render();}else{stopRun();S.main.phase='review';S.main.failure=null;S.main.visualChecked=false;S.main.paused=false;notify('SD-1042 检查已结算，等待你验收。','SD-1042 checks have settled. Your review is needed.');addActivity('模拟检查结束，进入待验收；尚未交付。','Mock checks settled. Ready for review, not delivered.');render();toast('示例证据已准备好。现在由你判断结果。','Sample evidence is ready. The judgment is yours.');}}
function beginExecution(revision){if(revision!==S.main.revision||S.main.phase!=='plan'){toast('方案已变化。请重新查看和批准当前版本。','The plan changed. Review and approve the current version.','warning');return;}S.main.approvedRevision=revision;S.main.approvedBudget=S.budget;S.main.phase='running';S.main.runIndex=0;S.main.failure=null;S.main.visualChecked=false;S.main.paused=false;S.main.accepted=false;S.main.delivered=false;S.connection=true;closeModal();addActivity('你批准了方案 v'+revision+' 的模拟执行。','You approved simulated execution of plan v'+revision+'.');go('workspace');scheduleRun();}
function replan(){stopRun();S.main.phase='plan';S.main.scope=S.main.scope||'filtered';S.main.failure=null;S.main.paused=false;S.main.accepted=false;S.main.delivered=false;S.main.approvedRevision=null;S.connection=true;go('workspace');}
function chooseScope(v){if(!['filtered','all','date'].includes(v))return;S.main.scope=v;S.focusTab='conversation';addActivity('已选择示例导出范围：'+scopeText(),'Selected the sample export scope: '+scopeText());render();setTimeout(()=>$('#chat-content')?.scrollTo({top:99999,behavior:'smooth'}),60);}
function resetPrimary(keepTour=false){stopRun();S.main=initialMain();S.project='all';S.focusTab='conversation';S.evidenceTab='preview';S.connection=true;S.tour=keepTour;S.memories=S.memories.filter(m=>m.id!=='m-delivery');S.notifications=[];S.activities=[];}
function jumpScene(scene){stopRun();closeModal();S.tour=false;S.main=initialMain();S.main.scope='filtered';S.connection=true;S.main.phase=['clarify','plan','running','review','delivered'].includes(scene)?scene:'review';S.main.approvedRevision=phaseIndex()>1?3:null;if(scene==='clarify')S.main.scope=null;if(scene==='running'){S.main.runIndex=2;S.main.paused=true;}if(scene==='review')S.main.runIndex=5;if(scene==='validation'){S.main.phase='review';S.main.failure='validation';S.main.runIndex=5;}if(scene==='delivered'){S.main.runIndex=5;S.main.accepted=true;S.main.delivered=true;S.main.visualChecked=true;recordDeliveryMemory();}go('workspace');toast('已载入预置场景。所有状态均为模拟。','Preset scene loaded. Every state is simulated.');}
function scenario(kind){stopRun();closeModal();S.view='workspace';S.tour=false;S.main.scope=S.main.scope||'filtered';S.main.approvedRevision=S.main.revision;S.main.visualChecked=false;S.main.accepted=false;S.main.delivered=false;S.connection=true;S.main.paused=false;S.main.failure=null;if(kind==='normal'){S.main.phase='running';S.main.runIndex=0;render();scheduleRun();}else if(kind==='validation'){S.main.phase='review';S.main.runIndex=5;S.main.failure='validation';render();notify('示例权限检查失败，需要修复。','The sample access-control check failed. A fix is needed.');}else if(kind==='stale'){S.main.phase='plan';S.main.approvedRevision=null;let rev=S.main.revision;render();openModal('approve',{rev,checked:true});}else{S.main.phase='blocked';S.main.failure=kind;S.main.runIndex=kind==='budget'?2:1;if(kind==='provider')S.connection=false;render();}addActivity('切换异常场景：'+kind,'Selected scenario: '+kind);}
function recordDeliveryMemory(){const range=(S.main.dateFrom||'2026-09-03')+' – '+(S.main.dateTo||'2026-09-11');const scopeZh=S.main.scope==='all'?'全部有权限的用户':S.main.scope==='date'?'日期范围 '+range:'当前筛选结果';const scopeEn=S.main.scope==='all'?'all accessible users':S.main.scope==='date'?'the date range '+range:'the current filters';const m={id:'m-delivery',title:P('导出范围与按钮文案已验收','Export scope and button label accepted'),text:P(`用户导出沿用${scopeZh}，只包含 name、email、role、status、created_at。按钮文案 ${S.main.label}；基于本 Demo 中你验收通过的 v${S.main.revision}。`,`User export follows ${scopeEn}, includes only name, email, role, status and created_at, and uses the label ${S.main.label}. Based on v${S.main.revision} accepted in this demo.`),status:'confirmed',source:P(`示例验收 · SD-1042 v${S.main.revision}`,`Sample acceptance · SD-1042 v${S.main.revision}`),project:'northstar',revision:S.main.revision,date:'09.11',kind:'decision'};S.memories=S.memories.filter(x=>x.id!=='m-delivery');S.memories.unshift(m);}
function startVoice(){if(voiceTimer)clearInterval(voiceTimer);const text=L('把昨天讨论的导出做好，沿用当前筛选，内部字段不要带出去。','Continue yesterday’s export. Keep the current filters and exclude internal fields.');openModal('voice',{done:false,transcript:'',voiceText:text});let at=0;voiceTimer=setInterval(()=>{if(!activeModal||activeModal.kind!=='voice'){clearInterval(voiceTimer);voiceTimer=null;return;}at+=S.lang==='zh'?2:4;activeModal.transcript=text.slice(0,at);const el=$('#voice-transcript');if(el)el.textContent=activeModal.transcript||'…';if(at>=text.length){clearInterval(voiceTimer);voiceTimer=null;activeModal.done=true;renderModal();}},100);}
function sendChat(text){text=text.trim().slice(0,1000);if(!text)return;const at='10:32';S.main.messages.push({who:'user',text:P(text,text),time:at});const lower=text.toLowerCase();if(/为什么|why|问题|question/.test(lower)){S.main.messages.push({who:'ai',text:P('字段和权限已经有你确认的来源。当前只剩“导出哪些数据”会改变实现与验收，所以不再要求你重复交代背景。','Fields and permissions already have your confirmed sources. Only the export scope changes implementation and acceptance, so I will not ask you to repeat the background.'),time:at});}else if(/当前筛选|current filter/.test(lower)){S.main.scope='filtered';S.main.messages.push({who:'ai',text:P('已将当前筛选作为示例范围。你可以查看方案后再批准执行。','Current filters are now the sample scope. Inspect the plan before approving execution.'),time:at});}else{S.main.messages.push({who:'ai',text:P('这条文字已保存在当前示例对话中。本文件不连接语言模型；请使用范围选项或“查看开工方案”继续预设流程。','Your text is saved in this sample conversation. This file does not connect to a language model; use a scope choice or Review the proposed plan to continue the scripted journey.'),time:at});}S.main.messages=S.main.messages.slice(-16);render();setTimeout(()=>$('#chat-content')?.scrollTo({top:99999,behavior:'smooth'}),50);}
function renderTour(){if(!S.tour){$('#tour-root').innerHTML='';return;}let idx=0,title='',description='',action='',next='';if(S.view==='memory'){idx=7;title=L('最后一步：项目记得你认可的决定。','Final step: the project remembers what you accepted.');description=L('新的已确认记忆有明确来源，下次继续不需要从头解释。','The new confirmed memory has a source, so the next task need not start from scratch.');action='end-tour';next=L('完成导览','Finish tour');}else if(S.view!=='workspace'){idx=0;title=L('01 · 从正在进行的项目开始','01 · Begin with an ongoing project');description=L('不是空白聊天窗口：先看谁需要你处理，再继续一件具体的事。','Not a blank chat: see what needs your judgment, then continue a concrete task.');action='tour-focus';next=L('进入主任务','Open the task');}else{let ph=S.main.phase;if(ph==='clarify'){idx=1;title=L('02 · 只问一个真正改变结果的问题','02 · Ask the one question that changes the result');description=S.main.scope?L('关键选择已有答案，下一步把它变成可批准的范围。','The key choice is answered. Now turn it into an approvable scope.'):L('字段与权限已经记得了。点击“当前筛选”，或者由下方按钮选择该示例。','Fields and access are remembered. Choose Current filters, or use the button below.');action=S.main.scope?'build-plan':'tour-scope';next=S.main.scope?L('查看方案','Inspect the plan'):L('选择当前筛选','Choose current filters');}else if(ph==='plan'){idx=2;title=L('03 · 就绪不等于授权','03 · A ready plan is not permission');description=L('看清做什么、不做什么和验收依据，然后进入独立的范围确认。','Inspect scope, exclusions and criteria, then approve this specific version.');action='approve';next=L('查看批准步骤','Inspect approval');}else if(ph==='running'){idx=3;title=L('04 · 看得懂进度，不必盯住日志','04 · Understand progress without watching logs');description=L('这里按阶段模拟执行。可以暂停、手动推进，也可以切换到异常场景。','The run advances through mock stages. Pause, advance manually, or try a failure scenario.');action='advance';next=L('推进模拟执行','Advance simulation');}else if(ph==='review'){idx=4;title=L('05 · 证据回来，判断留给你','05 · Evidence comes back. Judgment stays with you.');description=L('试一下示例导出，再勾选界面验收。检查失败时，系统不会放行交付。','Try the sample export and confirm the visual review. Failed checks block delivery.');action=S.main.visualChecked&&!S.main.failure?'accept':S.main.failure?'fix-validation':'tour-visual';next=S.main.failure?L('修复模拟检查','Fix mock check'):S.main.visualChecked?L('确认验收','Accept the result'):L('我已检查样例','I reviewed the sample');}else if(ph==='accepted'){idx=5;title=L('06 · 合并，另一次明确的决定','06 · Merge is a separate, explicit decision');description=L('验收通过不会自动影响主分支。下一步会清楚标注为模拟身份确认。','Acceptance does not change the main branch. The next step explicitly simulates identity verification.');action='merge';next=L('查看交付确认','Inspect delivery confirmation');}else if(ph==='delivered'){idx=6;title=L('07 · 下次，不必重新交代','07 · Next time, no need to repeat yourself');description=L('交付后沉淀的是你认可的版本，不是 AI 自评的结论。','What is remembered is the version you accepted, not an AI claim of success.');action='tour-memory';next=L('查看新的项目记忆','See the new project memory');}else{idx=3;title=L('遇到阻塞，也把下一步讲清楚','Even a blocker should have a clear next step');description=L('状态保留。修复或明确取消，不把未知写成完成。','State stays intact. Recover or stop explicitly; never mark unknown as done.');action='replan';next=L('返回批准的起点','Return to the plan');}}
 $('#tour-root').innerHTML=`<section class="tour-bar" aria-label="${L('演示导览','Guided tour')}"><span class="tour-count">${String(idx+1).padStart(2,'0')} / 08</span><div class="grow"><strong>${title}</strong><p>${description}</p></div>${btn(next,action,'primary','arrow')}${ibtn('x','end-tour',L('退出导览','Exit tour'))}</section>`;
}
function resetAll(){stopRun();closeModal();if(providerTimer){clearTimeout(providerTimer);providerTimer=null;}const lang=S.lang;S=fresh();S.lang=lang;projects.splice(3);try{localStorage.removeItem(STORE);}catch(_){}go('today');toast('演示已重置，只保留语言选择。','Demo reset. Your language choice was preserved.');}

case'theme':S.theme=S.theme==='dark'?'light':'dark';render();break;

case'new-project':openModal('new-project');break;
case'create-project':{const name=$('#project-name').value.trim();if(!name){toast('请填写示例项目名称。','Please enter a sample project name.','warning');return;}if(projects.some(p=>p.name.toLowerCase()===name.toLowerCase())){toast('这个项目名称已存在，请使用另一个名称。','That project name already exists. Use a different name.','warning');return;}const writing=$('#project-kind').value==='writing';const p={id:'custom-'+Date.now(),name,type:P(writing?'写作概念样例':'示例开发项目',writing?'Writing concept':'Sample coding project'),tone:writing?'purple':'teal',icon:writing?'book':'grid'};projects.push(p);S.customProjects=S.customProjects||[];S.customProjects.push(p);S.project=p.id;go('today');toast('已创建浏览器内的示例项目，没有创建真实目录。','Sample project created in this browser. No real folder was created.');break;}

case'evidence-tab':S.evidenceTab=el.dataset.tab;render();break;
case'phase':{let idx=Number(el.dataset.index),pi=phaseIndex();if(idx===pi)return;if(idx===0){openModal('artifact',{id:'brief'});}else if(idx===1&&pi>1){openModal('receipt');}else if(idx===2&&pi>2){openModal('artifact',{id:'verification'});}else toast('先完成当前步骤，或从“场景切换”进入明确标记的模拟样例。','Complete the current step, or use Scenarios for a clearly marked preset sample.','info');break;}
case'scope':if(el.dataset.value==='date')openModal('date-scope');else chooseScope(el.dataset.value);break;
case'confirm-date':{const from=$('#date-from').value,to=$('#date-to').value;if(!from||!to||from>to){toast('请选择有效日期，开始日期不能晚于结束日期。','Choose valid dates; the start cannot be after the end.','warning');return;}S.main.dateFrom=from;S.main.dateTo=to;closeModal();chooseScope('date');break;}
case'build-plan':if(!S.main.scope){toast('请先选择导出数据范围。','Choose an export scope first.','warning');return;}S.main.phase='plan';go('workspace');break;
case'approve':if(S.main.phase!=='plan'){toast('请先查看当前方案。','Review the current plan first.','warning');return;}openModal('approve',{rev:S.main.revision,checked:false});break;
case'confirm-approve':if(!activeModal?.checked||activeModal.rev!==S.main.revision){toast('这份确认无效，请重新查看当前方案。','This approval is invalid. Review the current plan.','warning');return;}beginExecution(activeModal.rev);break;
case'make-stale':if(activeModal?.kind==='approve'){S.main.revision++;activeModal.checked=false;addActivity('模拟：确认期间方案已更新，旧确认失效。','Simulation: plan changed during approval; prior confirmation invalidated.');render();renderModal();}break;
case'replan':replan();break;
case'defer-plan':notify('SD-1042 方案已保留，等待你决定。','SD-1042 plan is retained and awaiting your decision.');go('today');toast('尚未开始执行。方案保留在待你拍板中。','Execution has not started. The plan remains in your decision queue.');break;
case'edit-plan':if(S.main.phase==='running'){S.main.paused=true;stopRun();render();}openModal('edit-plan');break;
case'save-plan':{const label=$('#edit-label').value.trim(),scope=$('#edit-scope').value;if(!label){toast('按钮文案不能为空。','The button label cannot be empty.','warning');return;}stopRun();S.main.label=label;S.main.scope=scope;S.main.revision++;S.main.approvedRevision=null;S.main.visualChecked=false;S.main.phase='plan';S.main.failure=null;S.main.accepted=false;S.main.delivered=false;S.connection=true;closeModal();addActivity('方案已修改为 v'+S.main.revision+'；旧批准作废。','Plan revised to v'+S.main.revision+'; previous approval invalidated.');render();toast('新方案需要你重新批准。','The revised plan requires your approval.');break;}
case'pause':if(S.main.phase==='running'){S.main.paused=!S.main.paused;render();scheduleRun();}break;

case'scenarios':openModal('scenarios');break;
case'scenario':scenario(el.dataset.scenario);break;
case'recover':if(S.main.failure==='budget'){openModal('budget');}else{S.connection=true;S.main.failure=null;S.main.phase='running';S.main.paused=false;go('workspace');scheduleRun();toast('模拟连接已恢复，从最后确认的阶段继续。','Simulated connection restored; continuing from the last confirmed stage.');}break;
case'reconnect':S.connection=true;if(S.main.phase==='blocked'&&S.main.failure==='provider'){S.main.failure=null;S.main.phase='running';S.main.paused=true;}render();toast('模拟连接已恢复。可在任务页明确继续。','Mock connection restored. Resume explicitly on the task page.');break;
case'confirm-budget':{let b=Number($('#recover-budget').value);if(!Number.isFinite(b)||b<=S.budget||b>500){toast('新预算需高于当前上限，并且不超过 500。','The new cap must exceed the current one and be no greater than 500.','warning');return;}S.budget=b;S.main.approvedBudget=b;S.main.phase='running';S.main.failure=null;S.main.paused=false;S.connection=true;go('workspace');scheduleRun();addActivity('你明确批准了新的示例预算。','You explicitly approved the new mock budget.');break;}

case'accept':if(!S.main.visualChecked||S.main.failure||S.main.phase!=='review'){toast('还有未确认或未通过的验收项。','Some criteria are unconfirmed or failing.','warning');return;}openModal('accept',{rev:S.main.revision});break;
