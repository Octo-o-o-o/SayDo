case'confirm-attach':S.main.attached=$$('input[name="attach-source"]:checked').map(e=>e.value);S.main.messages.push({who:'ai',text:P(`已关联 ${S.main.attached.length} 份内置示例资料；没有读取本机文件。`,`Linked ${S.main.attached.length} built-in sample sources. No local files were read.`),time:'10:32'});go('workspace');break;
case'memory-filter':S.memoryFilter=el.dataset.filter;render();break;
case'memory-detail':openModal('memory-detail',{id:el.dataset.id});break;
case'memory-edit':openModal('memory-edit',{id:el.dataset.id});break;
case'save-memory':{let v=S.memories.find(x=>x.id===el.dataset.id),title=$('#memory-title').value.trim(),text=$('#memory-text').value.trim();if(!v||!title||!text){toast('标题和决定内容都不能为空。','Title and decision text are required.','warning');return;}v.title=P(title,title);v.text=P(text,text);v.revision++;v.date='09.11';v.source=P('你在演示中编辑','Edited by you in the demo');closeModal();render();toast('记忆已保存为新版，来源身份未自动升级。','Memory saved as a new revision. Its authority was not automatically upgraded.');break;}
case'confirm-memory':{let v=S.memories.find(x=>x.id===el.dataset.id);if(v?.status==='candidate'){v.status='confirmed';v.source=P('你在演示中明确确认','Explicitly confirmed by you in the demo');v.revision++;v.date='09.11';closeModal();render();toast('候选已明确确认；不自动扩大正在运行的任务范围。','Candidate explicitly confirmed. It does not automatically expand an active task.');}break;}
case'memory-forget':openModal('forget',{id:el.dataset.id});break;
case'confirm-forget':{let v=S.memories.find(x=>x.id===el.dataset.id);if(v){v.status='forgotten';v.title=P('已遗忘','Forgotten');v.text=P('','');v.source=P('仅保留遗忘标记','Forgetting marker only');}closeModal();render();toast('已移除该条示例正文，只保留遗忘标记。','Sample content removed. Only the forgetting marker remains.');break;}
case'export-memory':download('SayDo_DEMO_memory.md',`# SayDo — Mock project memory\n\nFictional demo content.\n\n`+S.memories.filter(m=>m.status!=='forgotten').map(m=>`## ${T(m.title)}\n\n${T(m.text)}\n\nStatus: ${m.status} · Version: ${m.revision}\nSource: ${T(m.source)}\n`).join('\n---\n\n'),'text/markdown;charset=utf-8');toast('示例记忆已导出。','Sample memory exported.');break;
case'artifact-filter':S.artifactFilter=el.dataset.filter;render();break;
case'provider-check':openModal('provider-check',{done:false});if(providerTimer)clearTimeout(providerTimer);providerTimer=setTimeout(()=>{if(activeModal?.kind==='provider-check'){activeModal.done=true;renderModal();}providerTimer=null;},950);break;
case'toggle-auto':S.autoRun=!S.autoRun;render();scheduleRun();break;
case'toggle-dnd':S.dnd=!S.dnd;render();break;
case'save-budget':{let val=Number($('#budget-input').value);if(!Number.isFinite(val)||val<1||val>500){toast('请输入 1–500 之间的预算。','Enter a cap between 1 and 500.','warning');return;}S.budget=val;render();toast('示例预算已保存，不构成任何真实计费授权。','Mock cap saved. No real billing authorization is given.');break;}
case'export-cost':{let cost=mockCost();download('SayDo_MOCK_costs.csv','\uFEFFdemo_only,task,category,currency,amount\r\n'+[['conversation',.2],['execution',.5],['reasoning',.2],['voice',.1]].map(([n,r])=>`true,SD-1042,${n},CNY,${fnum(cost*r)}`).join('\r\n')+'\r\n','text/csv;charset=utf-8');break;}
case'export-state':download('SayDo_DEMO_state.json',JSON.stringify({notice:'SIMULATED DEMO STATE ONLY — no real services called',exportedAt:new Date().toISOString(),state:S},null,2),'application/json');break;
case'reset':openModal('reset');break;
case'confirm-reset':resetAll();break;
case'onboard-back':S.onboardStep=Math.max(0,S.onboardStep-1);render();break;
case'onboard-next':if(S.onboardStep===1&&!S.providerChecked)return;S.onboardStep=Math.min(3,S.onboardStep+1);render();break;
case'onboard-provider':S.providerChoice=el.dataset.value;S.providerChecked=false;render();break;
case'onboard-project':S.onboardProject=el.dataset.id;render();break;
case'onboard-check':el.disabled=true;el.innerHTML='<span class="loading-ring"></span>'+L('模拟检查中…','Simulating check…');if(providerTimer)clearTimeout(providerTimer);providerTimer=setTimeout(()=>{S.providerChecked=true;providerTimer=null;render();toast('模拟检查已通过；没有检查真实环境。','Simulated check passed. The real environment was not inspected.');},700);break;
case'notifications':openModal('notifications');break;
case'read-all':S.defaultNotificationRead=true;S.notifications.forEach(n=>n.read=true);renderModal();save();toast('演示通知已标为已读，不等于任务已处理。','Demo notifications marked read. Tasks are not thereby resolved.');break;
case'notification-open':{if(el.dataset.id==='default'){S.defaultNotificationRead=true;openModal('generic-task',{id:'t2'});}else{let n=S.notifications.find(x=>String(x.id)===el.dataset.id);if(n)n.read=true;go('workspace');}break;}
case'generic-choice':if(activeModal){activeModal.choice=el.dataset.value;renderModal();}break;
case'generic-resolve':{const id=el.dataset.id,t=allTasks().find(x=>x.id===id);if(!t)return;if((t.status==='waiting'||t.status==='clarify')&&!$('#generic-answer')?.value.trim()){toast('请先补充一条示例内容。','Add sample context first.','warning');return;}if(t.id==='t5'&&!activeModal?.choice)return;let change=t.status==='running'?{status:'review'}:{status:'done'};const txt=$('#generic-answer')?.value.trim()||activeModal?.choice;if(txt)change.answer=txt;if(S.extraTasks.some(x=>x.id===id))Object.assign(S.extraTasks.find(x=>x.id===id),change);else S.secondary[id]={...(S.secondary[id]||{}),...change};closeModal();render();toast('示例事项状态已更新。','Sample task state updated.');break;}
default:toast('这项操作不在演示范围中。','This action is outside the demo scope.','info');console.warn('Unhandled demo action',a);
}save();}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el){e.preventDefault();Promise.resolve(handleAction(el)).catch(err=>{console.error(err);toast('演示操作未完成，请重试或重置场景。','The demo action did not finish. Retry or reset the scene.','warning');});return;}if(e.target.matches('[data-backdrop]'))closeModal();});
document.addEventListener('submit',e=>{if(e.target.id==='chat-form'){e.preventDefault();const v=$('#chat-input').value;sendChat(v);}});
document.addEventListener('change',e=>{const el=e.target,k=el.dataset.change;if(k==='preview-filter'){S.main.filter=el.value;render();if(activeModal)renderModal();}else if(k==='visual'){S.main.visualChecked=el.checked;render();}else if(k==='approve-check'&&activeModal?.kind==='approve'){activeModal.checked=el.checked;const b=$('[data-act="confirm-approve"]');if(b)b.disabled=!el.checked||activeModal.rev!==S.main.revision;}save();});
document.addEventListener('input',e=>{const k=e.target.dataset.input;if(k==='command-search')$('#command-results').innerHTML=commandResults(e.target.value);else if(k==='memory-search'){const q=e.target.value.toLowerCase().trim();let visible=0;$$('[data-memory-row]').forEach(row=>{let yes=row.dataset.search.includes(q);row.style.display=yes?'':'none';if(yes)visible++;});$('#memory-empty').style.display=visible?'none':'block';}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openModal('search');return;}if(e.key==='Escape'){if(activeModal)closeModal();else document.body.classList.remove('menu-open');return;}if(e.target.id==='chat-input'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendChat(e.target.value);return;}if(activeModal&&e.key==='Tab'){const focusable=$$('button:not(:disabled),input:not(:disabled),select,textarea,a[href],[tabindex="0"]',$('#modal-root')).filter(x=>x.offsetParent!==null);if(!focusable.length)return;const first=focusable[0],last=focusable.at(-1);if(!$('#modal-root').contains(document.activeElement)){e.preventDefault();(e.shiftKey?last:first).focus();}else if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
window.addEventListener('beforeunload',()=>{save();stopRun();});
// Restore custom sample projects; never load external code or executable state.
if(Array.isArray(S.customProjects))for(const p of S.customProjects){if(p&&typeof p.id==='string'&&typeof p.name==='string'&&!projects.some(x=>x.id===p.id))projects.push(p);}
render();
</script>
</body></html>
